          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/BookingParty'
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        cohort:
          type: integer
          readOnly: true
          nullable: true
          description: Set when this booking is a seat in a group class rather than
            a 1:1 session. Its teacher, level and start must match the cohort's.
        routed_reason:
          allOf:
          - $ref: '#/components/schemas/RoutedReasonEnum'
          readOnly: true
          description: |-
            How this booking's teacher was decided. Defaults to 'student_choice', which is what Phase 3's direct booking is.

            * `lead_available` - Routed to the lead teacher, who had capacity
            * `lead_full_routed` - Lead teacher full, routed to a sub teacher
            * `student_choice` - Teacher named directly by the student or parent
            * `cohort_assigned` - Assigned a seat in an open cohort
        start_time_utc:
          type: string
          format: date-time
          readOnly: true
          description: Stored UTC, always.
        start_time_local:
          type: string
          nullable: true
          description: start_time_utc in the caller's own zone, so nobody does the
            maths.
          readOnly: true
        end_time_utc:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        video_provider:
          type: string
          readOnly: true
        video_provider_meeting_id:
          type: string
          readOnly: true
        video_join_url:
          type: string
          readOnly: true
      required:
      - cohort
      - duration_minutes
      - end_time_utc
      - id
      - level
      - routed_reason
      - start_time_local
      - start_time_utc
      - status
      - student
      - teacher
      - track
      - video_join_url
      - video_provider
      - video_provider_meeting_id
    BookingCreate:
      type: object
      description: |-
        A student books themselves, or a parent books a linked child.

        Everything about *whether* the slot is legal — declared hours, overlap, an
        approved teacher, the track specialty, the weekly cap — belongs to
        ``Booking.clean()`` and is surfaced from there, so the API and a direct ORM
        write cannot disagree. This serializer only resolves who the session is for.

        ``routed_reason`` is not a client field: naming your own teacher *is*
        ``student_choice``, which the model already defaults to. Phase 4's other
        three reasons are the routing engine's to record.
      properties:
        teacher:
          type: integer
        level:
          type: integer
        start_time_utc:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
          default: 30
        student:
          type: integer
          description: Required when a parent books; ignored when a student books.
      required:
      - level
      - start_time_utc
      - teacher
    BookingParty:
      type: object
      description: A person on one side of a booking. No signup_code, no sprawl.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
      required:
      - first_name
      - id
      - last_name
      - role
      - timezone
      - username
    BookingStatusEnum:
      enum:
      - scheduled
      - completed
      - no_show
      - cancelled
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `completed` - Completed
        * `no_show` - No show
        * `cancelled` - Cancelled
    ChannelEnum:
      enum:
      - email
      - whatsapp
      - telegram
      - push
      - in_app
      type: string
      description: |-
        * `email` - Email
        * `whatsapp` - WhatsApp
        * `telegram` - Telegram
        * `push` - Push
        * `in_app` - In-App
    Cohort:
      type: object
      description: |-
        Read representation of a group class.

        Seat *counts* are published; the seated students are not. Who else is in a
        class is not something the open-cohorts endpoint needs to tell every
        authenticated caller, and a roster is a different endpoint's decision to make.
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/BookingParty'
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        max_students:
          type: integer
          readOnly: true
        seats_taken:
          type: integer
          readOnly: true
        seats_available:
          type: integer
          readOnly: true
        schedule_start_utc:
          type: string
          format: date-time
          readOnly: true
          description: Stored UTC, always.
        schedule_start_local:
          type: string
          nullable: true
          description: The start in the caller's zone, falling back to the teacher's.
          readOnly: true
      required:
      - id
      - level
      - max_students
      - schedule_start_local
      - schedule_start_utc
      - seats_available
      - seats_taken
      - teacher
      - track
    CohortCreate:
      type: object
      description: |-
        The lead teacher opens a group class.

        ``students`` is deliberately not writable: seats are given by routing or by
        ``Cohort.add_student``, both of which create the seat's ``Booking`` too. A
        cohort that could be created with students already in it would have members
        holding no session.
      properties:
        teacher:
          type: integer
        level:
          type: integer
        max_students:
          type: integer
          maximum: 2147483647
          minimum: 1
          default: 6
        schedule_start_utc:
          type: string
          format: date-time
          description: Stored UTC, always.
      required:
      - level
      - schedule_start_utc
      - teacher
    CriterionAverage:
      type: object
      description: One criterion's average over a period. ``average`` is null when
        unscored.
      properties:
        criterion_id:
          type: integer
          readOnly: true
        criterion_name:
          type: string
          readOnly: true
        average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        score_count:
          type: integer
          readOnly: true
      required:
      - average
      - criterion_id
      - criterion_name
      - score_count
    EventTypeEnum:
      enum:
      - booking_confirmed
      - booking_cancelled
      - placement_reviewed
      - progress_ready
      - teacher_invitation
      type: string
      description: |-
        * `booking_confirmed` - Booking Confirmed
        * `booking_cancelled` - Booking Cancelled
        * `placement_reviewed` - Placement Reviewed
        * `progress_ready` - Progress Ready
        * `teacher_invitation` - Teacher Invitation
    FamilyAssessment:
      type: object
      description: |-
        What a student or their linked parent reads.

        Teaching content and nothing else: the summary the teacher wrote for them, the
        criterion scores and comments, who taught it. Every internal quality-control
        field is absent from the shape rather than blanked — no ``flagged_for_review``,
        no ``flag_reason``, no ``lead_*`` at all.
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/AssessmentBooking'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        assessed_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        assessed_at:
          type: string
          format: date-time
          readOnly: true
          description: When it was submitted. Stored UTC, rendered per-viewer.
        assessed_at_local:
          type: string
          nullable: true
          readOnly: true
        rubric_name:
          type: string
          readOnly: true
          description: Snapshot of the rubric's name at submission time.
        scores:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentScore'
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        teacher_summary:
          type: string
          readOnly: true
          description: 'Written for the family: this is the one free-text field they
            read.'
      required:
      - assessed_at
      - assessed_at_local
      - assessed_by
      - booking
      - id
      - overall_average
      - rubric_name
      - scores
      - teacher_summary
      - track
    FamilyProgressSnapshot:
      type: object
      description: |-
        The family's view. No ``generated_by``, and only published rows reach it.

        ``visible_to_family`` is absent from the shape because the endpoint already
        filters on it: a row a family can read is published by definition, so
        publishing it again as a field would be noise. Which rows those are is the
        view's decision, not this class's.
      properties:
        id:
          type: integer
          readOnly: true
        track:
          allOf:
          - $ref: '#/components/schemas/TrackBrief'
          readOnly: true
        period_start:
          type: string
          format: date-time
          readOnly: true
          description: Inclusive. Stored UTC.
        period_end:
          type: string
          format: date-time
          readOnly: true
          description: Exclusive. Stored UTC.
        generated_at:
          type: string
          format: date-time
          readOnly: true
        completed_sessions:
          type: integer
          readOnly: true
          description: Sessions taught in the period, assessed or not.
        assessed_sessions:
          type: integer
          readOnly: true
          description: How many of those carry an assessment. Never inflated to match.
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: 'Null when nothing in the period was assessed. Deliberately
            nullable: ''no assessments'' is missing data, and 0.00 would read as a
            score of zero out of five.'
        criterion_averages:
          readOnly: true
          description: 'Snapshot of the per-criterion averages: [{criterion_id, criterion_name,
            average, score_count}].'
        summary:
          type: string
          readOnly: true
          description: Short human line. Auto-composed from the numbers unless the
            lead supplies one.
      required:
      - assessed_sessions
      - completed_sessions
      - criterion_averages
      - generated_at
      - id
      - overall_average
      - period_end
      - period_start
      - summary
      - track
    GenerationResult:
      type: object
      description: What a generation run did — created records, and skipped bookings.
      properties:
        period_start:
          type: string
          format: date-time
          readOnly: true
        period_end:
          type: string
          format: date-time
          readOnly: true
        created_count:
          type: integer
          readOnly: true
        skipped_count:
          type: integer
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
