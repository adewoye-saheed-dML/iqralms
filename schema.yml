      - teacher
      - parent
      - student
      type: string
      description: |-
        * `admin` - admin
        * `teacher` - teacher
        * `parent` - parent
        * `student` - student
    KindEnum:
      enum:
      - teachers
      - students
      - parents
      type: string
      description: |-
        * `teachers` - Teachers
        * `students` - Students
        * `parents` - Parents
    LeadAssessment:
      type: object
      description: 'The lead''s view: everything, including the flag reason and the
        review note.'
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/AssessmentBooking'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        assessed_by:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        assessed_at:
          type: string
          format: date-time
          readOnly: true
          description: When it was submitted. Stored UTC, rendered per-viewer.
        assessed_at_local:
          type: string
          nullable: true
          readOnly: true
        rubric_name:
          type: string
          readOnly: true
          description: Snapshot of the rubric's name at submission time.
        criteria_snapshot:
          readOnly: true
          description: 'Snapshot of the criteria scored: [{id, name, order}]. What
            the teacher was actually looking at, frozen.'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentScore'
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        teacher_summary:
          type: string
          readOnly: true
          description: 'Written for the family: this is the one free-text field they
            read.'
        flagged_for_review:
          type: boolean
          readOnly: true
          description: The teacher asking the lead to look at this session.
        flag_reason:
          type: string
          readOnly: true
          description: Why it was flagged. Internal — never shown to a student or
            parent.
        lead_reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set by an explicit lead action. Viewing an assessment does
            not set it.
        lead_reviewed_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        lead_review_note:
          type: string
          readOnly: true
          description: The lead's private annotation. Not visible to the family, and
            not visible to the assessing sub-teacher either in this phase.
      required:
      - assessed_at
      - assessed_at_local
      - assessed_by
      - booking
      - criteria_snapshot
      - flag_reason
      - flagged_for_review
      - id
      - lead_review_note
      - lead_reviewed_at
      - lead_reviewed_by
      - overall_average
      - rubric_name
      - scores
      - student
      - teacher_summary
      - track
    LeadReview:
      type: object
      description: |-
        The lead annotates an assessment and marks it reviewed.

        A note and nothing else is writable, which is the whole point: review is an
        annotation beside the teacher's scores, never an edit of them. The model
        refuses the edit too, so this is the polite layer rather than the only one.
      properties:
        lead_review_note:
          type: string
          maxLength: 4000
    Level:
      type: object
      description: |-
        One rung of a track's ladder.

        ``track`` is on the read shape because the academy-scoped level endpoints are
        flat — a client listing an academy's levels needs to know which track each one
        belongs to, and the level's academy is exactly its track's academy.
      properties:
        id:
          type: integer
          readOnly: true
        track:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
          description: Sequence within the track, 1 = first. Appended, never inserted.
        name:
          type: string
          readOnly: true
        min_age:
          type: integer
          readOnly: true
          nullable: true
          description: Informational only in this phase — not a hard gate. A 10-year-old
            and a 40-year-old can both sit at Beginner Arabic.
        group_eligible:
          type: boolean
          readOnly: true
          description: Whether this level may run as a cohort. Cohorts arrive in Phase
            4; the data is captured now so routing has something to read.
      required:
      - group_eligible
      - id
      - min_age
      - name
      - order
      - track
    LevelCreate:
      type: object
      description: |-
        Appending a level to one of this academy's tracks.

        ``order`` is deliberately not accepted. The Phase 2 rule is that levels are
        appended and never inserted, and a server that computes the next order cannot
        be argued with — there is no request that expresses "insert at 2", so the rule
        holds without having to reject anything. ``Level.next_order_for()`` is the same
        function the model validates against, so the two cannot disagree.

        ``track`` resolves inside this academy only, which is what rejects the phase
        spec's named attack: Academy A's route plus Academy B's track id.
      properties:
        track:
          type: integer
        name:
          type: string
          maxLength: 80
        min_age:
          type: integer
          minimum: 1
          nullable: true
          description: Informational only — not a hard gate on who may sit the level.
        group_eligible:
          type: boolean
          default: false
      required:
      - name
      - track
    LinkedStudent:
      type: object
      description: A child as seen by their linked parent — no signup_code, no PII
        sprawl.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        is_minor:
          type: boolean
          readOnly: true
          description: Snapshot computed from date_of_birth at signup. Not recomputed
            on birthdays — see learnings.md.
        is_fully_active:
          type: boolean
          readOnly: true
      required:
      - date_of_birth
      - email
      - first_name
      - id
      - is_fully_active
      - is_minor
      - last_name
      - timezone
      - username
    LocalWindow:
      type: object
      description: A weekly window as it reads in one particular timezone.
      properties:
        timezone:
          type: string
        weekday:
          type: integer
          description: May differ from the UTC weekday — a conversion can cross midnight.
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - start_time
      - timezone
      - weekday
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
      required:
      - password
    MembershipStatusEnum:
      enum:
      - active
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
    MyOrganizationMembership:
      type: object
      description: |-
        The caller's own membership, with the academy it is in — the ``/mine/`` shape.

        Membership id, organization, organization role and status: enough for a client
        to know which academies the user is in and what they may do in each, which is
        what the spec asks of this endpoint. Another user's membership never appears
        here; the view scopes the queryset to ``request.user``.
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/OrganizationRoleEnum'
          readOnly: true
          description: |-
            Authority inside this academy. Independent of User.role — a user may be 'teacher' here and 'student' globally.

            * `owner` - Owner
            * `admin` - Administrator
            * `staff` - Staff
            * `teacher` - Teacher
            * `parent` - Parent
            * `student` - Student
        role_display:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatusEnum'
          readOnly: true
          description: |-
            active grants tenant access; suspended keeps the row and revokes it.

            * `active` - Active
            * `suspended` - Suspended
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - role
      - role_display
      - status
      - status_display
    MyPricingAgreement:
      type: object
      description: |-
        The family's view: their rate, without the lead's reasoning.

        ``notes`` and ``approved_by`` are both absent. The note is private by
        instruction; the approver is omitted because there is exactly one lead and
        "who agreed this" is internal bookkeeping rather than something the family
        needs from this endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        standard_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: What this level would normally cost, snapshotted when the agreement
            was made. Deliberately stored rather than derived, so changing the standard
            rate later cannot silently reprice an existing agreement.
        agreed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: What was actually negotiated. May equal standard_rate.
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        reason_display:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
          description: False once a later agreement for the same student and level
            supersedes this one. Superseded rows are kept, never deleted.
      required:
      - active
      - agreed_rate
      - id
      - level
      - reason
      - reason_display
      - standard_rate
      - track
    MyStatement:
      type: object
      description: |-
        A teacher's own statement for one period.

        Computed from the payout records listed inside it, so the total and the rows
        cannot disagree — there is no statement table to fall out of step with them.
        ``status`` says how settled the period is; ``empty`` means no payout record
        exists for it yet, which is not the same statement as "you earned nothing".
      properties:
        period_start:
          type: string
          format: date-time
          readOnly: true
        period_end:
          type: string
          format: date-time
          readOnly: true
        session_count:
          type: integer
          readOnly: true
        finalized_count:
          type: integer
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatementStatusEnum'
          readOnly: true
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/MyTeacherPayout'
          readOnly: true
      required:
      - currency
      - finalized_count
      - payouts
      - period_end
      - period_start
      - session_count
      - status
      - total_amount
    MyTeacherPayout:
      type: object
      description: |-
        The teacher's own payout: what they earned, and for which session.

        ``teacher`` is absent — the caller is the only possible answer. Everything
        that produced the amount is present, because a payout the teacher cannot
        check is not transparent: ``minutes_paid`` and ``rate_used`` are the two
        inputs, and ``amount`` is what the one formula made of them.
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/PayoutSession'
          readOnly: true
        cohort:
          type: integer
          readOnly: true
          nullable: true
          description: Set when the paid session is a group class, so the unique constraint
            below can enforce one payout per cohort session. Always equal to booking.cohort.
        minutes_paid:
          type: integer
          readOnly: true
          description: Session length used in the calculation, snapshotted from the
            booking. Stored rather than derived so the record explains its own amount
            without depending on a row that could later be corrected.
        rate_used:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: 'The teacher''s hourly rate at generation time, snapshotted
            the same way PricingAgreement.standard_rate is: changing the live rate
            must not reprice a payout that has already been made.'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: minutes_paid / 60 × rate_used, rounded once. See payout_amount().
        currency:
          type: string
          readOnly: true
          description: ISO code, snapshotted. NGN today; conversion is out of scope.
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          readOnly: true
          description: |-
            generated → finalized. Finalized records are immutable.

            * `generated` - Generated
            * `finalized` - Finalized
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Stamped when the lead finalizes. Null while generated.
      required:
      - amount
      - booking
      - cohort
      - created_at
      - currency
      - finalized_at
      - id
      - minutes_paid
      - rate_used
      - status
      - status_display
    NoCapacity:
      type: object
      description: The honest failure. Documented as a schema so a client can rely
        on it.
      properties:
        routed:
          type: boolean
        reason:
          type: string
        detail:
          type: string
        considered:
          type: object
          additionalProperties: {}
          description: 'Why each step declined, keyed by step: ''cohort'', ''lead'',
            ''sub_teachers''. Present so the frontend can explain the refusal rather
            than showing a bare error. A preferred-teacher request adds ''preferred_teacher''
            (the refusal for that teacher) and ''waitlist'' (the waitlist entry created,
            when one was) — the Phase 4 shape extended, not replaced.'
      required:
      - considered
      - detail
      - reason
      - routed
    Notification:
      type: object
      description: Academy notification serializer with masked deliveries and read
        status.
      properties:
        id:
          type: integer
          readOnly: true
        organization_id:
          type: integer
          description: The academy this notification belongs to.
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
          description: |-
            The event type triggering this notification.

            * `booking_confirmed` - Booking Confirmed
            * `booking_cancelled` - Booking Cancelled
            * `placement_reviewed` - Placement Reviewed
            * `progress_ready` - Progress Ready
            * `teacher_invitation` - Teacher Invitation
        event_type_display:
          type: string
          readOnly: true
        recipient_id:
          type: integer
          description: The recipient of this notification.
          readOnly: true
        recipient_username:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
          description: Short headline summary.
        summary:
          type: string
          readOnly: true
          description: Human-readable notification text.
        payload:
          readOnly: true
          description: JSON-serializable domain payload stripped of secrets or provider
            details.
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when recipient marked this notification read.
        created_at:
          type: string
          format: date-time
          readOnly: true
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
          readOnly: true
      required:
      - created_at
      - deliveries
      - event_type
      - event_type_display
      - id
      - is_read
      - organization_id
      - payload
      - read_at
      - recipient_id
      - recipient_username
      - summary
      - title
    NotificationDelivery:
      type: object
      description: Delivery record serializer — strictly provider secrets/credentials
        free.
      properties:
        id:
          type: integer
          readOnly: true
        notification_id:
          type: integer
          description: The notification being delivered.
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
          description: |-
            Channel used for delivery.

            * `email` - Email
            * `whatsapp` - WhatsApp
            * `telegram` - Telegram
            * `push` - Push
            * `in_app` - In-App
        channel_display:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
          description: Provider adapter identifier (e.g., 'email_smtp', 'meta_whatsapp').
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationDeliveryStatusEnum'
          readOnly: true
          description: |-
            Delivery status outcome.

            * `pending` - Pending
            * `sent` - Sent
            * `delivered` - Delivered
            * `failed` - Failed
        status_display:
          type: string
          readOnly: true
        attempt_count:
          type: integer
          readOnly: true
          description: Number of delivery attempts executed.
        provider_message_id:
          type: string
          readOnly: true
          description: Identifier returned by the external provider.
        error_code:
          type: string
          readOnly: true
          description: Machine-readable error code if failed.
        error_message:
          type: string
          readOnly: true
          description: Human-readable error details if failed.
        attempted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of the latest delivery attempt.
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when delivery was confirmed.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt_count
      - attempted_at
      - channel
      - channel_display
      - created_at
      - delivered_at
      - error_code
      - error_message
      - id
      - notification_id
      - provider
      - provider_message_id
      - status
      - status_display
    NotificationDeliveryStatusEnum:
      enum:
      - pending
      - sent
      - delivered
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `sent` - Sent
        * `delivered` - Delivered
        * `failed` - Failed
    Organization:
      type: object
      description: |-
        An academy — the read shape, and the one that creates a tenant.

        ``is_active`` is read-only: disabling an academy is a later phase's workflow
        with its own consequences for the people inside it, not a field a creation
        request gets to set. ``timezone`` is validated by the model's own IANA
        validator, which the ``ModelSerializer`` picks up, so the API and a direct ORM
        write reject the same strings.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Human-readable institution name, e.g. 'Al-Huda Quran Academy'.
            Not unique — two academies may legitimately choose similar names.
          maxLength: 120
        slug:
          type: string
          description: Machine-readable identifier, e.g. 'al-huda-quran-academy'.
            Globally unique, because the organization is itself the tenant and so
            has nothing to be scoped within.
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        timezone:
          type: string
          description: IANA zone name, e.g. 'Africa/Lagos'. The academy's own zone,
            validated by the same rule as User.timezone.
          maxLength: 64
        is_active:
          type: boolean
          readOnly: true
          description: Whether the academy is operating. Disabling an organization
            is a later phase's workflow, so nothing reads this yet — access is decided
            by active membership alone (see learnings.md).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - name
      - slug
      - timezone
      - updated_at
    OrganizationInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          description: The email address invited. Used to match the user on acceptance.
        role:
          allOf:
          - $ref: '#/components/schemas/OrganizationRoleEnum'
          readOnly: true
          description: |-
            The role the user will hold upon acceptance.

            * `owner` - Owner
            * `admin` - Administrator
            * `staff` - Staff
            * `teacher` - Teacher
            * `parent` - Parent
            * `student` - Student
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationInvitationStatusEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        email_delivery_status:
          type: string
          readOnly: true
      required:
      - created_at
      - email
      - email_delivery_status
      - expires_at
      - id
      - role
      - status
    OrganizationInvitationAccept:
      type: object
      description: Accepts an invitation using its token.
      properties:
        token:
          type: string
      required:
      - token
    OrganizationInvitationCreate:
      type: object
      description: Creates a pending invitation for an email address.
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/InvitableOrganizationRoleEnum'
      required:
      - email
      - role
    OrganizationInvitationPreview:
      type: object
      description: Safe public representation of an invitation for the acceptance
        screen.
      properties:
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - organization_id
      - organization_name
      - role
      - status
    OrganizationInvitationRegister:
      type: object
      description: Registers a new user and accepts a pending invitation in one step.
      properties:
        token:
          type: string
          writeOnly: true
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
        password:
          type: string
          writeOnly: true
        timezone:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
      required:
      - password
      - timezone
      - token
    OrganizationInvitationRegisterResponse:
      type: object
      description: Response returned upon successful invitation-based registration.
      properties:
        key:
          type: string
          description: DRF auth token key.
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        membership:
          allOf:
          - $ref: '#/components/schemas/OrganizationMembership'
          readOnly: true
        detail:
          type: string
          readOnly: true
      required:
      - detail
      - key
      - membership
      - user
    OrganizationInvitationStatusEnum:
      enum:
      - pending
      - accepted
      - expired
      - revoked
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `expired` - Expired
        * `revoked` - Revoked
    OrganizationMembership:
      type: object
      description: |-
        One membership, as an owner or admin reads it in the tenant's directory.

        ``username`` travels with the user id because a membership list is read by a
        human deciding who to suspend or promote, and an id alone does not identify a
        person. No email, no signup code, no account detail beyond the name: this is a
        membership record, not a user directory, and ``accounts`` owns the latter.
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/OrganizationRoleEnum'
          readOnly: true
          description: |-
            Authority inside this academy. Independent of User.role — a user may be 'teacher' here and 'student' globally.

            * `owner` - Owner
            * `admin` - Administrator
            * `staff` - Staff
            * `teacher` - Teacher
            * `parent` - Parent
            * `student` - Student
        role_display:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatusEnum'
          readOnly: true
          description: |-
            active grants tenant access; suspended keeps the row and revokes it.

            * `active` - Active
            * `suspended` - Suspended
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - role
      - role_display
      - status
      - status_display
      - updated_at
      - user
      - username
    OrganizationRoleEnum:
      enum:
      - owner
      - admin
      - staff
      - teacher
      - parent
      - student
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Administrator
        * `staff` - Staff
        * `teacher` - Teacher
        * `parent` - Parent
        * `student` - Student
    OrganizationTeacherConfiguration:
      type: object
      description: |-
        One academy's terms for one teacher, as an owner or admin reads them.

        ``user`` and ``organization`` travel as ids alongside the membership because a
        client reading a list of teaching terms needs to know whose they are without a
        second request, and ``username`` because an id does not identify a person to the
        human deciding whether to approve them. Nothing else from the account: this is a
        teaching-terms record, not a user directory.

        Entirely read-only. Writes go through the create and update shapes below, so
        there is no path here that could move a configuration to another membership.
      properties:
        id:
          type: integer
          readOnly: true
        membership:
          type: integer
          readOnly: true
          description: The academy-and-teacher relationship these terms apply to.
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
        max_weekly_hours:
          type: integer
          readOnly: true
          description: Capacity dial for this academy only. Scheduling still enforces
            TeacherProfile.max_weekly_hours until scheduling tenancy lands.
        hourly_payout_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: What this academy pays per hour. Null means no per-hour rate,
            as on TeacherProfile. Payout calculation still reads that one.
        approved:
          type: boolean
          readOnly: true
          description: Approved to teach *here*. An academy approves its own teachers,
            so a teacher may be approved by one and not another.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved
      - created_at
      - hourly_payout_rate
      - id
      - max_weekly_hours
      - membership
      - organization
      - updated_at
      - user
      - username
    OrganizationTeacherConfigurationCreate:
      type: object
      description: |-
        Giving an existing member of this academy their teaching terms.

        The caller names a ``user``, not a membership — the same shape
        ``OrganizationMembershipCreateSerializer`` uses, and for the same reason: the
        membership is then looked up *inside* the view's verified organization, so a
        membership id belonging to another academy is not something a request can even
        express. The academy is never in the payload.

        ``approved`` may be sent at creation. Unlike the global ``TeacherProfile``,
        which the admin approves after the fact, an academy adding a teacher it has
        already vetted should not have to make two calls; the default is still False.
      properties:
        user:
          type: integer
        max_weekly_hours:
          type: integer
          minimum: 1
        hourly_payout_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        approved:
          type: boolean
          default: false
      required:
      - max_weekly_hours
      - user
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    ParentLinkCreate:
      type: object
      description: |-
        A parent links themselves to a student using the student's signup code.

        The view resolves ``student_code`` to a user (404 when no student holds that
        code) and passes it to ``save(student=...)``.
      properties:
        student_code:
          type: string
          writeOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/LinkedStudent'
          readOnly: true
      required:
      - student
      - student_code
    PatchedAssessmentRubricUpdate:
      type: object
      description: |-
        Editing live configuration in place: rename, retire, append.

        This is the operation the historical-data rule is about. Nothing here touches
        an existing ``AssessmentScore`` — a renamed criterion keeps its old name on
        every assessment already submitted, because that name was snapshotted onto the
        score. Retiring a criterion stops *new* assessments scoring it and leaves old
        ones intact.
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        active:
          type: boolean
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentCriterionWrite'
    PatchedLevelUpdate:
      type: object
      description: |-
        Editing a level's description. Not its position, and not its track.

        ``order`` and ``track`` are both absent. Renumbering a ladder is a deliberate
        operation on the whole track rather than a field edit (``Level.clean()``
        refuses it), and moving a level to another track would move it to another
        academy — the same thing ``Track`` refuses for itself.
      properties:
        name:
          type: string
          maxLength: 80
        min_age:
          type: integer
          minimum: 1
          nullable: true
        group_eligible:
          type: boolean
    PatchedOrganizationMembershipUpdate:
      type: object
      description: |-
        Suspending, reactivating, or changing what a member may do here.

        Both fields are optional, so this is the one shape behind three operations —
        suspend, reactivate, re-role. Neither ``organization`` nor ``user`` is
        editable: moving a membership between tenants or between people is not a
        change to a relationship, it is a different relationship.

        ``role`` offers the assignable subset, so a PATCH cannot promote anyone to
        ``owner``; the owner's own row is refused earlier still, by
        ``permissions.OwnerMembershipIsProtected``.
      properties:
        role:
          $ref: '#/components/schemas/AssignableOrganizationRoleEnum'
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
    PatchedOrganizationTeacherConfigurationUpdate:
      type: object
      description: |-
        Changing what this academy asks of, and pays, one of its teachers.

        All three fields optional, so one shape covers approving a teacher, re-capping
        their week and re-rating their hour. ``membership`` is absent and not editable:
        moving these terms to a different person or a different academy is not a change
        to a relationship, it is a different relationship.
      properties:
        max_weekly_hours:
          type: integer
          minimum: 1
        hourly_payout_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        approved:
          type: boolean
    PatchedStudentEnrollmentUpdate:
      type: object
      description: Updating a student's enrollment status.
      properties:
        status:
          $ref: '#/components/schemas/StudentEnrollmentUpdateStatusEnum'
        track_id:
          type: integer
          nullable: true
        level_id:
          type: integer
          nullable: true
    PatchedTeacherTrackUpdate:
      type: object
      description: |-
        Withdrawing or restoring a teacher's eligibility for a track.

        ``active`` only. Moving an assignment to a different teacher or a different
        track is not a change to a relationship, it is a different relationship — and
        the row is never deleted, so the record of what was once granted survives the
        way a suspended membership does.
      properties:
        active:
          type: boolean
    PatchedTrackWrite:
      type: object
      description: |-
        Creating or renaming one academy's track.

        ``organization`` is absent by design, not omitted for brevity: the academy is
        the view's verified route context, so there is no field for a caller to point
        at a tenant they do not administer. Nor is it editable afterwards —
        ``Track.clean()`` refuses to move a track between academies, because that
        would carry its levels, placements and teacher assignments with it.

        Slug collisions are reported on the ``slug`` field rather than left to the
        database, and the check is scoped: ``tajweed`` may be taken *here* and free
        everywhere else. The model's ``(organization, slug)`` constraint is still the
        backstop.
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
    PayoutGenerate:
      type: object
      description: |-
        The lead's generation request: a period, and optionally one teacher.

        ``teacher`` narrows a run to one person — useful when a rate was set late and
        only that teacher's sessions need picking up. Omitting it generates for the
        whole academy. Either way the run is idempotent, so narrowing is a convenience
        rather than a way to avoid duplicates.

        Only ``lead`` and ``sub`` accounts are offered, because nobody else can be a
        booking's teacher. A student id here is a 400 rather than an empty run.
        When scoped to an organization, only active teachers in that organization are accepted.
      properties:
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        teacher:
          type: integer
          nullable: true
      required:
      - period_end
      - period_start
    PayoutSession:
      type: object
      description: |-
        The session a payout is for — enough to reconcile a total, no more.

        This is what the spec means by "the session references needed to understand
        how the total was produced": which student, which level, when, how long, and
        whether it was a group class. ``cohort`` being non-null is also the reader's
        explanation for why a busy group session appears once rather than six times.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        level:
          type: string
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        start_time_utc:
          type: string
          format: date-time
          readOnly: true
          description: Stored UTC, always.
        duration_minutes:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        cohort:
          type: integer
          readOnly: true
          nullable: true
          description: Set when this booking is a seat in a group class rather than
            a 1:1 session. Its teacher, level and start must match the cohort's.
      required:
      - cohort
      - duration_minutes
      - id
      - level
      - start_time_utc
      - status
      - status_display
      - student
      - track
    PayoutStatusEnum:
      enum:
      - generated
      - finalized
      type: string
      description: |-
        * `generated` - Generated
        * `finalized` - Finalized
    PlacementAudioAccess:
      type: object
      description: |-
        The response of the audio-access endpoint: a URL with an expiry.

        Serializer rather than a hand-built dict so the field types reach the
        OpenAPI schema — a client needs to know the URL stops working, and
        ``expires_at`` is the only thing telling it that.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          description: 'Short-lived private access to the recitation sample. Treat
            it as a secret: whoever holds it can fetch the file until it expires.'
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC instant after which the URL stops working.
        expires_in:
          type: integer
          readOnly: true
          description: Seconds of remaining validity when issued.
      required:
      - expires_at
      - expires_in
      - url
    PlacementResult:
      type: object
      description: |-
        Read representation, shared by the submit, queue, 'mine' and children endpoints.

        Carries no URL for the audio. ``has_audio_sample`` is what a client branches
        on, ``audio_filename`` is what it shows in a list, and a signed URL comes
        from the dedicated endpoint when someone actually presses play.

        ``organization`` is the placement's own academy, read through its track. It is
        the only academy identifier in the payload — the spec forbids exposing
        unrelated ones, and there is nowhere here for one to come from.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/PlacementStudent'
          readOnly: true
        organization:
          type: integer
          description: The owning academy's id, without loading the organization row.
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        has_audio_sample:
          type: boolean
          readOnly: true
        audio_filename:
          type: string
          nullable: true
          description: |-
            The sample's filename, without the storage path that holds it.

            The basename only. The full key is an implementation detail of the
            private bucket, and publishing it would put the one piece of the storage
            layout a client has no use for into every response.
          readOnly: true
        skipped_as_beginner:
          type: boolean
          readOnly: true
          description: Student declared themselves a complete beginner instead of
            recording. Mutually exclusive with audio_sample.
        recommended_level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        reviewed_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at_local:
          type: string
          nullable: true
          description: reviewed_at (stored UTC) in the requesting user's own timezone.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PlacementResultStatusEnum'
          readOnly: true
          description: |-
            Recomputed from reviewed_at on every save(); never set by a client.

            * `pending` - Pending review
            * `reviewed` - Reviewed
      required:
      - audio_filename
      - has_audio_sample
      - id
      - organization
      - recommended_level
      - reviewed_at
      - reviewed_at_local
      - reviewed_by
      - skipped_as_beginner
      - status
      - student
      - track
    PlacementResultStatusEnum:
      enum:
      - pending
      - reviewed
      type: string
      description: |-
        * `pending` - Pending review
        * `reviewed` - Reviewed
    PlacementReview:
      type: object
      description: |-
        The lead teacher sets the level; the model stamps who and when.

        Two narrowings, one inside the other. ``recommended_level`` is restricted to
        levels of *this academy's* tracks, and then to this placement's own track — the
        first is the tenant boundary, the second is the Phase 2 product rule, and
        neither substitutes for the other.
      properties:
        recommended_level:
          type: integer
      required:
      - recommended_level
    PlacementStudent:
      type: object
      description: The student as the review queue needs them — no signup_code, no
        sprawl.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
        is_minor:
          type: boolean
          readOnly: true
          description: Snapshot computed from date_of_birth at signup. Not recomputed
            on birthdays — see learnings.md.
      required:
      - first_name
      - id
      - is_minor
      - last_name
      - timezone
      - username
    PlacementSubmit:
      type: object
      description: |-
        A student submits a recitation sample, or declares themselves a beginner.

        Exactly one of the two. Rejected at this layer with a 400 so the client gets
        a field error rather than the model's invariant surfacing as a 500 — which
        is the same reason the Phase 6 upload rules are attached to the field here
        rather than only enforced in the model.

        SaaS Phase 3 narrowed ``track`` to the academy in the URL. A student who
        belongs to two academies submits to each through its own route, and a track id
        from the academy they are *not* addressing is simply not in the queryset.
      properties:
        track:
          type: integer
        audio_sample:
          type: string
          format: uri
          nullable: true
          description: 'Up to 15 MB, one of: .flac, .m4a, .mp3, .mp4, .oga, .ogg,
            .opus, .wav, .webm. The file''s actual contents are checked, not just
            its name and declared type.'
        skipped_as_beginner:
          type: boolean
          default: false
      required:
      - track
    PricingAgreement:
      type: object
      description: |-
        The lead's view: everything, including the private note.

        Used by the create response and by the per-student history listing, so a
        superseded row reads exactly like a live one apart from ``active``.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/PricingStudent'
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        standard_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: What this level would normally cost, snapshotted when the agreement
            was made. Deliberately stored rather than derived, so changing the standard
            rate later cannot silently reprice an existing agreement.
        agreed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: What was actually negotiated. May equal standard_rate.
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        reason_display:
          type: string
          readOnly: true
        approved_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        notes:
          type: string
          readOnly: true
          description: 'Private: what was actually agreed and why. Never exposed to
            the student or their parent — see serializers.py.'
        active:
          type: boolean
          readOnly: true
          default: true
          description: False once a later agreement for the same student and level
            supersedes this one. Superseded rows are kept, never deleted.
      required:
      - active
      - agreed_rate
      - approved_by
      - id
      - level
      - notes
      - reason
      - reason_display
      - standard_rate
      - student
      - track
    PricingAgreementCreate:
      type: object
      description: |-
        The lead records a rate. Creating one supersedes the previous one.

        ``approved_by`` is not a client field — it is the requesting lead, the same
        way ``PlacementResult.reviewed_by`` is stamped from the request rather than
        supplied. ``active`` is not a client field either: a new agreement is the live
        one by definition, and deactivating an old one is the model's job, not a flag
        a caller sets.
      properties:
        student:
          type: integer
        level:
          type: integer
        standard_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: What this level would normally cost, snapshotted when the agreement
            was made. Deliberately stored rather than derived, so changing the standard
            rate later cannot silently reprice an existing agreement.
        agreed_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: What was actually negotiated. May equal standard_rate.
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        notes:
          type: string
          description: 'Private: what was actually agreed and why. Never exposed to
            the student or their parent — see serializers.py.'
      required:
      - agreed_rate
      - level
      - reason
      - standard_rate
      - student
    PricingStudent:
      type: object
      description: The student as a pricing row needs them — no signup_code, no sprawl.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
      required:
      - first_name
      - id
      - last_name
      - timezone
      - username
    ProgressSnapshot:
      type: object
      description: The lead's view of a snapshot, including who generated it.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        track:
          allOf:
          - $ref: '#/components/schemas/TrackBrief'
          readOnly: true
        period_start:
          type: string
          format: date-time
          readOnly: true
          description: Inclusive. Stored UTC.
        period_end:
          type: string
          format: date-time
          readOnly: true
          description: Exclusive. Stored UTC.
        generated_at:
          type: string
          format: date-time
          readOnly: true
        completed_sessions:
          type: integer
          readOnly: true
          description: Sessions taught in the period, assessed or not.
        assessed_sessions:
          type: integer
          readOnly: true
          description: How many of those carry an assessment. Never inflated to match.
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: 'Null when nothing in the period was assessed. Deliberately
            nullable: ''no assessments'' is missing data, and 0.00 would read as a
            score of zero out of five.'
        criterion_averages:
          readOnly: true
          description: 'Snapshot of the per-criterion averages: [{criterion_id, criterion_name,
            average, score_count}].'
        summary:
          type: string
          readOnly: true
          description: Short human line. Auto-composed from the numbers unless the
            lead supplies one.
        generated_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        visible_to_family:
          type: boolean
          readOnly: true
          description: Off until the lead publishes it. A family reads only published
            snapshots.
      required:
      - assessed_sessions
      - completed_sessions
      - criterion_averages
      - generated_at
      - generated_by
      - id
      - overall_average
      - period_end
      - period_start
      - student
      - summary
      - track
      - visible_to_family
    ProgressSnapshotCreate:
      type: object
      description: |-
        The lead generates a snapshot for one student, track and period.

        Every number in the result is computed here, not supplied: a snapshot a caller
        could hand values to would not be evidence of anything. Repeating the same
        request returns the existing row and a 200 rather than creating a second one.
      properties:
        student:
          type: integer
          description: Must be a student account; the model enforces the role.
        track:
          type: integer
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 2000
        visible_to_family:
          type: boolean
          default: false
      required:
      - period_end
      - period_start
      - student
      - track
    ReasonEnum:
      enum:
      - discount_hardship
      - premium_direct
      - sibling_discount
      - standard
      type: string
      description: |-
        * `discount_hardship` - Discount — financial hardship
        * `premium_direct` - Premium — chose the lead teacher directly
        * `sibling_discount` - Sibling discount
        * `standard` - Standard — no negotiation
    RecentSummary:
      type: object
      description: A teacher summary as a family reads it — the one free-text field
        they see.
      properties:
        assessment_id:
          type: integer
          readOnly: true
        taught_at:
          type: string
          format: date-time
          readOnly: true
        assessed_at:
          type: string
          format: date-time
          readOnly: true
        teacher_summary:
          type: string
          readOnly: true
      required:
      - assessed_at
      - assessment_id
      - taught_at
      - teacher_summary
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/SelfRegisterableRoleEnum'
        timezone:
          type: string
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
          maxLength: 64
        date_of_birth:
          type: string
          format: date
          nullable: true
      required:
      - email
      - password
      - role
      - timezone
      - username
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    RoleEnum:
      enum:
      - lead
      - sub
      - student
      - parent
      type: string
      description: |-
        * `lead` - Lead teacher
        * `sub` - Sub teacher
        * `student` - Student
        * `parent` - Parent
    RouteRequest:
      type: object
      description: |-
        ``POST /route/`` — let the system decide who teaches this.

        ...unless ``preferred_teacher`` is given, which is Phase 5's addition: naming
        a teacher turns off the routing order entirely and asks about that person
        alone. It is optional and additive, so every Phase 4 client keeps working
        unchanged — and a request that omits it is still refused a smuggled
        ``teacher`` key, because auto-routing must never quietly honour a preference
        it was not asked to honour.
      properties:
        level:
          type: integer
        requested_time_window:
          $ref: '#/components/schemas/TimeWindow'
        student:
          type: integer
          description: Required when a parent requests; ignored when a student does.
        preferred_teacher:
          type: integer
          nullable: true
          description: 'Ask for one teacher by name. Skips cohort/lead/sub resolution
            entirely: books that teacher if they can take it, otherwise puts the student
            on that teacher''s waitlist rather than assigning anybody else. Always
            a 1:1 session, never a cohort seat.'
      required:
      - level
      - requested_time_window
    Routed:
      type: object
      description: What routing decided. Read-only; assembled from a ``routing.Routed``.
      properties:
        routed:
          type: boolean
        routed_reason:
          type: string
        booking:
          $ref: '#/components/schemas/Booking'
        cohort:
          allOf:
          - $ref: '#/components/schemas/Cohort'
          nullable: true
      required:
      - booking
      - cohort
      - routed
      - routed_reason
    RoutedReasonEnum:
      enum:
      - lead_available
      - lead_full_routed
      - student_choice
      - cohort_assigned
      type: string
      description: |-
        * `lead_available` - Routed to the lead teacher, who had capacity
        * `lead_full_routed` - Lead teacher full, routed to a sub teacher
        * `student_choice` - Teacher named directly by the student or parent
        * `cohort_assigned` - Assigned a seat in an open cohort
    SelfRegisterableRoleEnum:
      enum:
      - sub
      - student
      - parent
      type: string
      description: |-
        * `sub` - sub
        * `student` - student
        * `parent` - parent
    SessionAssessmentCreate:
      type: object
      description: |-
        A teacher submits one completed session's assessment.

        ``booking`` and ``assessed_by`` are not client fields. The booking comes from
        the URL, scoped by the view to sessions this teacher taught; the assessor is
        the requesting user, stamped the same way ``PlacementResult.reviewed_by`` and
        ``PricingAgreement.approved_by`` are. A teacher naming somebody else as the
        assessor is not a request this API can express.
      properties:
        scores:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentScoreWrite'
        teacher_summary:
          type: string
          maxLength: 4000
        flagged_for_review:
          type: boolean
          default: false
        flag_reason:
          type: string
          maxLength: 2000
      required:
      - scores
    SkippedBooking:
      type: object
      description: |-
        One booking generation looked at and did not pay, and why.

        Reported rather than swallowed: ``no_payout_rate`` on a sub-teacher's session
        is the lead's cue to set a rate and run again, and it must not be
        indistinguishable from a quiet period.
      properties:
        booking_id:
          type: integer
          readOnly: true
        teacher_id:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
      required:
      - booking_id
      - reason
      - teacher_id
    Statement:
      type: object
      description: |-
        The lead's view of any teacher's statement: the same totals, plus whose.

        ``teacher`` is a plain ``CharField`` over the username rather than a related
        field: a statement is a computed dataclass, not a model instance, so there is
        no model for a relational field to resolve against.
      properties:
        period_start:
          type: string
          format: date-time
          readOnly: true
        period_end:
          type: string
          format: date-time
          readOnly: true
        session_count:
          type: integer
          readOnly: true
        finalized_count:
          type: integer
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatementStatusEnum'
          readOnly: true
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/TeacherPayout'
          readOnly: true
        teacher:
          type: string
          readOnly: true
      required:
      - currency
      - finalized_count
      - payouts
      - period_end
      - period_start
      - session_count
      - status
      - teacher
      - total_amount
    StatementStatusEnum:
      enum:
      - empty
      - generated
      - partly_finalized
      - finalized
      type: string
      description: |-
        * `empty` - No payout records in this period
        * `generated` - Generated, none finalized
        * `partly_finalized` - Partly finalized
        * `finalized` - Fully finalized
    StudentDetail:
      type: object
      description: A student's enrollment, as seen in the academy's detail view.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
        is_minor:
          type: boolean
          readOnly: true
        enrollment_status:
          type: string
          readOnly: true
        track_id:
          type: integer
          readOnly: true
          nullable: true
        level_id:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_of_birth
      - email
      - enrollment_status
      - first_name
      - id
      - is_minor
      - last_name
      - level_id
      - track_id
      - updated_at
      - user_id
      - username
    StudentEnrollmentCreate:
      type: object
      description: Enrolling an existing student user into an academy.
      properties:
        user:
          type: integer
        track_id:
          type: integer
          nullable: true
        level_id:
          type: integer
          nullable: true
      required:
      - user
    StudentEnrollmentUpdateStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    StudentList:
      type: object
      description: A student's enrollment, as seen in the academy's list.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
        is_minor:
          type: boolean
          readOnly: true
        enrollment_status:
          type: string
          readOnly: true
        track_id:
          type: integer
          readOnly: true
          nullable: true
        level_id:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_of_birth
      - email
      - enrollment_status
      - first_name
      - id
      - is_minor
      - last_name
      - level_id
      - track_id
      - updated_at
      - user_id
      - username
    StudentProgress:
      type: object
      description: |-
        Progress in one track, for the student or their linked parent.

        ``overall_average`` and every criterion average are nullable, and null means
        "nothing assessed in this period" rather than "scored zero". ``recommended_level``
        is read from Phase 2's placement result and is never written by this app.
      properties:
        track:
          allOf:
          - $ref: '#/components/schemas/TrackBrief'
          readOnly: true
        recommended_level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
          nullable: true
        period_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        period_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_sessions:
          type: integer
          readOnly: true
        assessed_sessions:
          type: integer
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        criterion_averages:
          type: array
          items:
            $ref: '#/components/schemas/CriterionAverage'
          readOnly: true
        last_assessed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recent_summaries:
          type: array
          items:
            $ref: '#/components/schemas/RecentSummary'
          readOnly: true
      required:
      - assessed_sessions
      - completed_sessions
      - criterion_averages
      - last_assessed_at
      - overall_average
      - period_end
      - period_start
      - recent_summaries
      - recommended_level
      - track
    TeacherAssessment:
      type: object
      description: |-
        The assessing teacher's view of their own submission.

        Carries their own flag and its reason — they wrote both — and
        ``lead_reviewed_at`` so they can see the lead has looked. It does **not**
        carry ``lead_review_note`` or ``lead_reviewed_by``: the spec's visibility
        section gives a sub-teacher no access to lead review notes in this phase, and
        widening that is a decision, not a serializer tweak.
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/AssessmentBooking'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        assessed_at:
          type: string
          format: date-time
          readOnly: true
          description: When it was submitted. Stored UTC, rendered per-viewer.
        assessed_at_local:
          type: string
          nullable: true
          readOnly: true
        rubric_name:
          type: string
          readOnly: true
          description: Snapshot of the rubric's name at submission time.
        criteria_snapshot:
          readOnly: true
          description: 'Snapshot of the criteria scored: [{id, name, order}]. What
            the teacher was actually looking at, frozen.'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentScore'
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        teacher_summary:
          type: string
          readOnly: true
          description: 'Written for the family: this is the one free-text field they
            read.'
        flagged_for_review:
          type: boolean
          readOnly: true
          description: The teacher asking the lead to look at this session.
        flag_reason:
          type: string
          readOnly: true
          description: Why it was flagged. Internal — never shown to a student or
            parent.
        lead_reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set by an explicit lead action. Viewing an assessment does
            not set it.
      required:
      - assessed_at
      - assessed_at_local
      - booking
      - criteria_snapshot
      - flag_reason
      - flagged_for_review
      - id
      - lead_reviewed_at
      - overall_average
      - rubric_name
      - scores
      - student
      - teacher_summary
      - track
    TeacherPayout:
      type: object
      description: 'The lead''s view: the same record, plus whose it is.'
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/PayoutSession'
          readOnly: true
        cohort:
          type: integer
          readOnly: true
          nullable: true
          description: Set when the paid session is a group class, so the unique constraint
            below can enforce one payout per cohort session. Always equal to booking.cohort.
        minutes_paid:
          type: integer
          readOnly: true
          description: Session length used in the calculation, snapshotted from the
            booking. Stored rather than derived so the record explains its own amount
            without depending on a row that could later be corrected.
        rate_used:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: 'The teacher''s hourly rate at generation time, snapshotted
            the same way PricingAgreement.standard_rate is: changing the live rate
            must not reprice a payout that has already been made.'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: minutes_paid / 60 × rate_used, rounded once. See payout_amount().
        currency:
          type: string
          readOnly: true
          description: ISO code, snapshotted. NGN today; conversion is out of scope.
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          readOnly: true
          description: |-
            generated → finalized. Finalized records are immutable.

            * `generated` - Generated
            * `finalized` - Finalized
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Stamped when the lead finalizes. Null while generated.
      required:
      - amount
      - booking
      - cohort
      - created_at
      - currency
      - finalized_at
      - id
      - minutes_paid
      - rate_used
      - status
      - status_display
      - teacher
    TeacherProfile:
      type: object
      description: Read-only in this phase; profiles are created via the admin.
      properties:
        bio:
          type: string
          readOnly: true
        max_weekly_hours:
          type: integer
          readOnly: true
          description: Capacity dial used by scheduling in a later phase.
        hourly_payout_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Null for the lead teacher, who is not paid a per-hour rate.
        is_lead:
          type: boolean
          readOnly: true
        approved:
          type: boolean
          readOnly: true
          description: A sub-teacher is not bookable until a lead flips this true.
      required:
      - approved
      - bio
      - hourly_payout_rate
      - is_lead
      - max_weekly_hours
    TeacherReport:
      type: object
      description: |-
        One teacher's row in the lead's quality report.

        Deliberately not sortable by score and deliberately without a rank field. The
        rows arrive ordered by username; a client that wants a league table has to
        build one itself, and the phase spec says not to.
      properties:
        teacher:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        assessed_sessions:
          type: integer
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        by_track:
          type: array
          items:
            $ref: '#/components/schemas/TeacherTrackReport'
          readOnly: true
        flagged:
          type: integer
          readOnly: true
        awaiting_lead_review:
          type: integer
          readOnly: true
      required:
      - assessed_sessions
      - awaiting_lead_review
      - by_track
      - flagged
      - overall_average
      - teacher
    TeacherTrack:
      type: object
      description: |-
        One teacher's eligibility for one track, inside one academy.

        ``user`` and ``organization`` are read off the membership rather than stored
        twice, which is the same shape ``accounts.OrganizationTeacherConfiguration``
        exposes and for the same reason: the membership is the only place the pair is
        written. ``username`` because an id does not identify a person to the human
        deciding what they may teach.
      properties:
        id:
          type: integer
          readOnly: true
        membership:
          type: integer
          readOnly: true
          description: The academy-and-teacher relationship this eligibility is for.
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
        track:
          type: integer
          readOnly: true
          description: A track owned by the same academy as the membership.
        track_slug:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
          description: Whether the teacher may currently be assigned this track here.
            Withdrawing eligibility keeps the row, the way a suspended membership
            does, so the record of what was once granted survives.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - id
      - membership
      - organization
      - track
      - track_slug
      - updated_at
      - user
      - username
    TeacherTrackCreate:
      type: object
      description: |-
        Giving one of this academy's teachers a track to teach.

        The caller names a ``user``, not a membership — the shape
        ``accounts.OrganizationTeacherConfigurationCreateSerializer`` established, and
        for the same reason: the membership is then looked up *inside* the view's
        verified organization, so a membership belonging to another academy is not
        something a request can express. An academy administrator therefore cannot
        reach a teacher's eligibility in a different academy even when they know both
        ids, which is the phase spec's cross-academy teacher requirement.

        ``track`` is narrowed to this academy for the same reason.
      properties:
        user:
          type: integer
        track:
          type: integer
        active:
          type: boolean
          default: true
      required:
      - track
      - user
    TeacherTrackReport:
      type: object
      properties:
        track:
          allOf:
          - $ref: '#/components/schemas/TrackBrief'
          readOnly: true
        assessed_sessions:
          type: integer
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
      required:
      - assessed_sessions
      - overall_average
      - track
    TimeWindow:
      type: object
      description: |-
        The slot a requested session would occupy: when it starts, how long it runs.

        The Phase 4 spec names the field ``requested_time_window`` without defining
        its shape. This is the exact-slot reading (product owner's call, 2026-08-24):
        routing decides *who* teaches, never *when*, so a student is never quietly
        moved to a different time than the one they asked for. The single exception is
        a cohort, whose own ``schedule_start_utc`` wins within
        ``COHORT_START_TOLERANCE`` — and the response says so, in ``routed_reason``.
      properties:
        start_time_utc:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
          default: 30
      required:
      - start_time_utc
    Token:
      type: object
      description: Serializer for Token model.
      properties:
        key:
          type: string
          maxLength: 40
      required:
      - key
    Track:
      type: object
      description: |-
        One academy's track, with its levels nested in order.

        ``organization`` travels in the body even though it is already in the URL. The
        future frontend holds tracks from several academies in one client — a teacher
        working for two of them — and a track that does not say whose it is has to be
        remembered rather than read.
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
          description: The academy that owns this track, and through it the track's
            levels and placements. Set at creation; not editable afterwards.
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Unique within the owning academy, not across the platform.
          pattern: ^[-a-zA-Z0-9_]+$
        levels:
          type: array
          items:
            $ref: '#/components/schemas/Level'
          readOnly: true
      required:
      - id
      - levels
      - name
      - organization
      - slug
    TrackBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Unique within the owning academy, not across the platform.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    TrackWrite:
      type: object
      description: |-
        Creating or renaming one academy's track.

        ``organization`` is absent by design, not omitted for brevity: the academy is
        the view's verified route context, so there is no field for a caller to point
        at a tenant they do not administer. Nor is it editable afterwards —
        ``Track.clean()`` refuses to move a track between academies, because that
        would carry its levels, placements and teacher assignments with it.

        Slug collisions are reported on the ``slug`` field rather than left to the
        database, and the check is scoped: ``tajweed`` may be taken *here* and free
        everywhere else. The model's ``(organization, slug)`` constraint is still the
        backstop.
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    User:
      type: object
      description: The requesting user's own profile.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
          maxLength: 64
        date_of_birth:
          type: string
          format: date
          nullable: true
        is_minor:
          type: boolean
          readOnly: true
          description: Snapshot computed from date_of_birth at signup. Not recomputed
            on birthdays — see learnings.md.
        is_fully_active:
          type: boolean
          readOnly: true
        signup_code:
          type: string
          readOnly: true
          description: Opaque code a student shares with a parent so the parent can
            link to them. Generated automatically at signup.
        teacher_profile:
          allOf:
          - $ref: '#/components/schemas/TeacherProfile'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        date_joined_local:
          type: string
          description: date_joined rendered in the user's own timezone (stored as
            UTC).
          readOnly: true
      required:
      - date_joined
      - date_joined_local
      - id
      - is_fully_active
      - is_minor
      - role
      - signup_code
      - teacher_profile
      - timezone
      - username
    WaitlistEntry:
      type: object
      description: |-
        Read representation of one waitlist entry, for whatever side is looking.

        ``requested_end_utc`` is derived from the start and duration — convenience,
        not another stored value. ``fulfilled_booking`` is published as the booking
        id when set; the full booking payload is not, because the interested party
        (the lead, the family) can read the session itself through the booking
        endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/WaitlistParty'
          readOnly: true
        requested_teacher:
          allOf:
          - $ref: '#/components/schemas/WaitlistParty'
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        requested_start_utc:
          type: string
          format: date-time
          readOnly: true
          description: The slot the family asked for, stored UTC. Not in the spec's
            field list — added with explicit approval so a promotion knows what time
            to offer.
        requested_end_utc:
          type: string
          format: date-time
          readOnly: true
        requested_start_local:
          type: string
          nullable: true
          description: The slot asked for, in the requesting user's zone.
          readOnly: true
        requested_duration_minutes:
          type: integer
          readOnly: true
          description: Length of the session asked for. Added alongside the start.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        requested_at_local:
          type: string
          nullable: true
          description: requested_at (stored UTC) in the requester's own zone.
          readOnly: true
        priority:
          type: integer
          readOnly: true
          description: Set by hand, never computed. The product owner's call (2026-08-25)
            on this phase's open question was that a premium_direct pricing agreement
            does *not* buy queue position, so nothing in the code writes this field
            — a lead raises it deliberately or not at all.
        notified:
          type: boolean
          readOnly: true
          description: 'Whether the family has been told a slot opened. Nothing in
            this phase sets it: automatic notification is explicitly out of scope
            (see tech-debt.md), so it is here for the phase that delivers it.'
        fulfilled_booking:
          type: integer
          readOnly: true
          nullable: true
          description: Set when this entry is promoted into a real session. The entry
            then stays as a record rather than being deleted.
        status:
          type: string
          description: '``open`` or ``fulfilled`` — the one thing a parent asks for.'
          readOnly: true
      required:
      - fulfilled_booking
      - id
      - level
      - notified
      - priority
      - requested_at
      - requested_at_local
      - requested_duration_minutes
      - requested_end_utc
      - requested_start_local
      - requested_start_utc
      - requested_teacher
      - status
      - student
      - track
    WaitlistParty:
      type: object
      description: A person in a waitlist row — no signup_code, no sprawl, same as
        bookings.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
      required:
      - first_name
      - id
      - last_name
      - role
      - timezone
      - username
    WaitlistPromote:
      type: object
      description: |-
        The lead promotes an entry into a session.

        The slot is optional: it defaults to the one the family asked for, and
        overrides only *when* the session runs — the entry always keeps its original
        request on record. ``duration_minutes`` defaults the same way.
      properties:
        start_time_utc:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
