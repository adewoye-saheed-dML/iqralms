    ActorTypeEnum:
      enum:
      - USER
      - SYSTEM
      type: string
      description: |-
        * `USER` - User
        * `SYSTEM` - System
    AssessmentBooking:
      type: object
      description: The session an assessment is about, in the shape every reader needs
        of it.
      properties:
        id:
          type: integer
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        start_time_utc:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - duration_minutes
      - id
      - level
      - start_time_utc
      - status
    AssessmentCriterion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Position on the sheet, 1 first. Unique within the rubric.
        active:
          type: boolean
          description: False stops *new* assessments scoring it. Existing scores are
            untouched — deactivating is not deleting.
      required:
      - id
      - name
      - order
    AssessmentCriterionWrite:
      type: object
      description: One criterion in a rubric write. ``id`` present means "edit that
        one".
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        order:
          type: integer
          minimum: 1
        active:
          type: boolean
    AssessmentParty:
      type: object
      description: A person on an assessment. No signup_code, no PII sprawl.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
      required:
      - first_name
      - id
      - last_name
      - role
      - timezone
      - username
    AssessmentRubric:
      type: object
      description: |-
        A rubric and its criteria, as the lead reads them.

        ``criteria`` is every criterion including the retired ones, because a lead
        editing configuration needs to see what they switched off. ``active_criteria``
        is the subset a new assessment would have to score, which is the operationally
        interesting list and is worth not making a client derive.
      properties:
        id:
          type: integer
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        track_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
          description: 'False once a later rubric for the same track supersedes this
            one. Superseded rubrics are kept: historical assessments reference their
            criteria.'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentCriterion'
          readOnly: true
        active_criteria:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentCriterion'
          readOnly: true
      required:
      - active
      - active_criteria
      - criteria
      - description
      - id
      - name
      - track
      - track_id
    AssessmentRubricCreate:
      type: object
      description: |-
        The lead configures a track's rubric.

        Creating one for a track that already has a live rubric **supersedes** the old
        row rather than editing or deleting it — the ``PricingAgreement`` pattern, and
        for the same reason: assessments already submitted point at the old rubric's
        criteria, so it has to survive. Renaming or retiring individual criteria is the
        *other* operation, and it is a PATCH on the rubric detail.
      properties:
        track:
          type: integer
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentCriterionWrite'
      required:
      - criteria
      - name
      - track
    AssessmentScore:
      type: object
      description: |-
        One criterion's mark. Shared by every read shape.

        ``criterion_name`` is the snapshot, not a live lookup, so an old assessment
        reads the way the teacher submitted it however the rubric has moved since. The
        live criterion id travels alongside it for anyone aggregating.
      properties:
        id:
          type: integer
          readOnly: true
        criterion:
          type: integer
          readOnly: true
        criterion_name:
          type: string
          readOnly: true
          description: Snapshot of the criterion's name at submission time.
        score:
          type: integer
          readOnly: true
          description: 1 needs significant improvement .. 5 excellent.
        comment:
          type: string
          readOnly: true
          description: Optional per-criterion note. Teaching feedback, not internal
            QC.
      required:
      - comment
      - criterion
      - criterion_name
      - id
      - score
    AssessmentScoreWrite:
      type: object
      description: |-
        One submitted mark. The criterion set is checked by the model, not here.

        ``criterion`` is a bare integer rather than a ``PrimaryKeyRelatedField``
        against every criterion in the academy on purpose: whether an id is a *live
        criterion of this booking's rubric* is exactly the question
        ``SessionAssessment.submit`` answers, and a queryset check here would answer a
        weaker version of it first and report the failure in the wrong words.
      properties:
        criterion:
          type: integer
        score:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 2000
      required:
      - criterion
      - score
