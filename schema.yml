  /api/curriculum/organizations/{organization_pk}/levels/:
    get:
      operationId: curriculum_organizations_levels_list
      description: |-
        /api/curriculum/organizations/{id}/levels/ — the academy's ladders.

        Flat rather than nested under a track, with ``?track=<id>`` to narrow it: a
        client rendering an academy's whole curriculum wants one request, and the
        ownership check is no less clear for it because the track is validated against
        the route's academy either way.

        POST appends. The next ``order`` is computed server-side, so "insert at
        position 2" is not a request this API can express — which is how the Phase 2
        append-only rule survives the arrival of a write endpoint.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: track
        schema:
          type: string
        description: Only levels of this track. A track id from another academy returns
          an empty list.
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Level'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization.
    post:
      operationId: curriculum_organizations_levels_create
      description: |-
        /api/curriculum/organizations/{id}/levels/ — the academy's ladders.

        Flat rather than nested under a track, with ``?track=<id>`` to narrow it: a
        client rendering an academy's whole curriculum wants one request, and the
        ownership check is no less clear for it because the track is validated against
        the route's academy either way.

        POST appends. The next ``order`` is computed server-side, so "insert at
        position 2" is not a request this API can express — which is how the Phase 2
        append-only rule survives the arrival of a write endpoint.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LevelCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LevelCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
          description: Appended at the track's next order. The first level of a track
            is order 1.
        '400':
          description: No such track in this academy — including a valid track id
            owned by a different one.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not this academy's owner or administrator.
  /api/curriculum/organizations/{organization_pk}/levels/{id}/:
    get:
      operationId: curriculum_organizations_levels_retrieve
      description: GET/PATCH one level. Its name and its description, never its position.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization.
        '404':
          description: No such object in this organization. A valid id belonging to
            another academy answers the same way — the response never confirms that
            a row exists elsewhere.
    patch:
      operationId: curriculum_organizations_levels_partial_update
      description: GET/PATCH one level. Its name and its description, never its position.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLevelUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLevelUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLevelUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
          description: ''
        '400':
          description: Nothing to change; order and track are not editable.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not this academy's owner or administrator.
        '404':
          description: No such object in this organization. A valid id belonging to
            another academy answers the same way — the response never confirms that
            a row exists elsewhere.
  /api/curriculum/organizations/{organization_pk}/placements/:
    post:
      operationId: curriculum_organizations_placements_create
      description: |-
        POST .../placements/ — a student of this academy submits audio or a skip.

        Two gates, both required. ``IsStudent`` is the account role, unchanged from
        Phase 2; ``IsOrganizationMember`` is the tenant, and it is what stops a student
        enrolled at Academy A from submitting into Academy B by knowing its id. The
        track then resolves inside this academy only, and ``PlacementResult.clean()``
        re-checks the membership at the model layer, so the admin and a direct ORM
        write are held to the same rule.

        Re-submitting for a track the student already has a placement for updates that
        row back to pending; it never creates a second one. A minor with no parent link
        yet may still submit — placement is a pre-enrolment step, and
        ``is_fully_active`` gates booking, not this.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementResult'
          description: Created or updated. A beginner skip comes back already 'reviewed'
            with the track's first level and no reviewer.
        '400':
          description: No such track in this academy, both audio and skip, neither
            of them, or a rejected upload.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not a student account.
  /api/curriculum/organizations/{organization_pk}/placements/{id}/audio-url/:
    get:
      operationId: curriculum_organizations_placements_audio_url_retrieve
      description: |-
        GET .../placements/{id}/audio-url/ — temporary access to a sample.

        Phase 6's authorisation step, with the academy check in front of it. Minting
        the URL *is* the authorisation, so the whole question of who may hear a
        recitation sample is decided here, and SaaS Phase 3 answers it with a
        conjunction:

        .. code-block:: text

            authenticated
                + active member of this academy
                + placement belongs to this academy
                + Phase 6's rule: the lead teacher, or the student themselves

        Nothing was widened. Sub-teachers and parents are still refused — a minor's
        voice recording is the last thing a tenancy phase should open up — and the
        roles are exactly Phase 6's.

        Everything unauthorised is a 404 rather than a 403, because the queryset is
        what narrows it: another academy's placement, another student's placement and a
        beginner skip with no recording all answer the same way, and none of them
        confirms that a row exists.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementAudioAccess'
          description: A short-lived URL for the recitation sample. It expires; ask
            again rather than storing it.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this academy, or neither the lead teacher
            nor a student.
        '404':
          description: No such placement in this academy, not this student's placement,
            or a beginner skip with no recording.
  /api/curriculum/organizations/{organization_pk}/placements/{id}/review/:
    post:
      operationId: curriculum_organizations_placements_review_create
      description: |-
        POST .../placements/{id}/review/ — this academy's lead sets the level.

        ``Lead A + Placement A`` is allowed and ``Lead A + Placement B`` is a 404, from
        the scoped queryset rather than from a permission class — the placement is not
        in this academy's queryset, so the response cannot confirm it exists. The
        model refuses the same thing again in ``clean()``: a reviewer must be an active
        member of the academy that owns the track.

        Review is still a one-way transition: an already-reviewed placement returns
        409. Correcting a level means the admin, or the student re-submitting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlacementReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlacementReview'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementResult'
          description: ''
        '400':
          description: No such level in this academy, or a level from a different
            track than the placement's.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not the lead teacher.
        '404':
          description: No such object in this organization. A valid id belonging to
            another academy answers the same way — the response never confirms that
            a row exists elsewhere.
        '409':
          description: Already reviewed.
  /api/curriculum/organizations/{organization_pk}/placements/children/:
    get:
      operationId: curriculum_organizations_placements_children_list
      description: |-
        GET .../placements/children/ — a parent's linked children, in this academy.

        Three conditions, and the phase spec is explicit that all three must hold: the
        parent is active here, the child is active here, and a ``ParentLink`` exists.
        ``accounts.tenancy.children_in_organization()`` is where that rule lives and
        this view calls it rather than re-deriving it — a second copy is the one that
        would eventually disagree, and the disagreement would be a parent reading
        another academy's student.

        A ``ParentLink`` is a global family fact, not a key: the same parent sees
        different children through Academy A's route and Academy B's.

        Read-only, and no audio. Phase 6 decided that a recitation sample is for the
        lead teacher and the student themselves, and SaaS Phase 3 is forbidden from
        widening that — so a parent can see *that* their child submitted a sample and
        where they were placed, and cannot hear it.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlacementResult'
          description: Placements of the caller's linked children who are active members
            of this academy. Empty when none are.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not a parent account.
  /api/curriculum/organizations/{organization_pk}/placements/mine/:
    get:
      operationId: curriculum_organizations_placements_mine_list
      description: |-
        GET .../placements/mine/ — the caller's own placements *in this academy*.

        A student studying at two academies calls this twice, once per route, and gets
        two disjoint lists. Their global set of placements is not something any single
        academy is shown.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlacementResult'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not a student account.
  /api/curriculum/organizations/{organization_pk}/placements/pending/:
    get:
      operationId: curriculum_organizations_placements_pending_list
      description: |-
        GET .../placements/pending/ — this academy's review queue.

        The endpoint Phase 2 got most wrong for a multi-tenant platform: it handed
        every pending placement on the platform to any lead teacher who asked. Now the
        queue is the intersection of "a lead teacher" and "a member of this academy",
        and it contains only placements whose track this academy owns and whose student
        it has admitted.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlacementResult'
          description: Pending placements in this academy only.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not the lead teacher.
  /api/curriculum/organizations/{organization_pk}/teachers/:
    get:
      operationId: curriculum_organizations_teachers_list
      description: |-
        /api/curriculum/organizations/{id}/teachers/ — who may teach what here.

        Owner and admin only, for reading as well as writing — the one curriculum
        endpoint that is not readable by every member. It follows ``accounts``'
        teacher-configurations endpoint rather than the track and level endpoints
        above, because the list names people and what the academy has entrusted them
        with, which is closer to the membership directory than to a syllabus. The
        teacher themselves reads it from ``teachers/mine/``, so nothing here is hidden
        from the person it is about.

        The membership is resolved from a ``user`` id *inside this academy*, so an
        administrator of one academy cannot touch the same teacher's eligibility in
        another — the phase spec's cross-academy teacher requirement, enforced by the
        lookup rather than by a check that could be forgotten.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherTrack'
          description: This academy's teacher-track assignments.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not this academy's owner or administrator.
    post:
      operationId: curriculum_organizations_teachers_create
      description: |-
        /api/curriculum/organizations/{id}/teachers/ — who may teach what here.

        Owner and admin only, for reading as well as writing — the one curriculum
        endpoint that is not readable by every member. It follows ``accounts``'
        teacher-configurations endpoint rather than the track and level endpoints
        above, because the list names people and what the academy has entrusted them
        with, which is closer to the membership directory than to a syllabus. The
        teacher themselves reads it from ``teachers/mine/``, so nothing here is hidden
        from the person it is about.

        The membership is resolved from a ``user`` id *inside this academy*, so an
        administrator of one academy cannot touch the same teacher's eligibility in
        another — the phase spec's cross-academy teacher requirement, enforced by the
        lookup rather than by a check that could be forgotten.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherTrackCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeacherTrackCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherTrackCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherTrack'
          description: ''
        '400':
