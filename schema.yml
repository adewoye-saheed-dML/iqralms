  /api/scheduling/organizations/{organization_pk}/bookings/{id}/cancel/:
    post:
      operationId: scheduling_organizations_bookings_cancel_create
      description: |-
        POST /api/scheduling/organizations/{id}/bookings/{id}/cancel/ — either party cancels.

        The row is kept and its status set; nothing is deleted, because attendance
        and payouts need the history later.

        The queryset is scoped to bookings the caller is a party to — the student,
        the teacher, or a parent linked to the student (a parent may book, so a
        parent may cancel) — strictly within the route academy. Anyone else gets a 404
        rather than a 403, so this endpoint cannot be used to discover that a
        booking exists.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '403':
          description: Not an active member of this organization.
        '404':
          description: No such booking for this caller in this organization.
        '409':
          description: Already cancelled, or completed and now history.
  /api/scheduling/organizations/{organization_pk}/bookings/mine/:
    get:
      operationId: scheduling_organizations_bookings_mine_list
      description: |-
        GET /api/scheduling/organizations/{id}/bookings/mine/ — the student's own sessions.

        Past and upcoming, every status, earliest first. Cancelled ones stay
        visible: they are history, not noise.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
  /api/scheduling/organizations/{organization_pk}/bookings/teaching/:
    get:
      operationId: scheduling_organizations_bookings_teaching_list
      description: GET /api/scheduling/organizations/{id}/bookings/teaching/ — sessions
        this teacher teaches.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
  /api/scheduling/organizations/{organization_pk}/cohorts/:
    post:
      operationId: scheduling_organizations_cohorts_create
      description: |-
        POST /api/scheduling/organizations/{id}/cohorts/ — the lead opens a group class.

        Lead-only: a cohort commits a teacher's time, so it is not something a
        sub-teacher grants themselves. Whether the level may run as a group at all,
        and whether the teacher teaches its track, are ``Cohort.clean()``'s calls and
        arrive here as 400s.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CohortCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CohortCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CohortCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohort'
          description: ''
        '400':
          description: Level is not group-eligible, the teacher is unapproved, or
            the teacher does not teach the level's track.
        '403':
          description: Not an active member of this organization.
  /api/scheduling/organizations/{organization_pk}/cohorts/open/:
    get:
      operationId: scheduling_organizations_cohorts_open_list
      description: |-
        GET /api/scheduling/organizations/{id}/cohorts/open/?level_id= — cohorts with a seat free.

        The same queryset routing's step 1 reads, exposed so a "browse open cohorts"
        view can be built on it later without a second definition of "open" existing.
        Seat counts are published; the roster is not (see ``CohortSerializer``).
      parameters:
      - in: query
        name: level_id
        schema:
          type: integer
        description: Which level's open cohorts to list.
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cohort'
          description: ''
  /api/scheduling/organizations/{organization_pk}/route/:
    post:
      operationId: scheduling_organizations_route_create
      description: |-
        POST /api/scheduling/organizations/{id}/route/ — the system picks who teaches.

        Cohort first, then the lead teacher if they have capacity, then a matched
        sub-teacher. The algorithm itself is in ``routing.py``; this view only
        translates its two outcomes into HTTP.

        A refusal is a **409**, not a 200 with ``routed: false`` and not a 400. The
        request was valid and was processed — what stands in the way is the state of
        the academy's capacity, which is precisely what 409 means, and it is the code
        Phase 3's cancel endpoint already uses for "valid request, wrong state". The
        body is structured either way, so a frontend can explain the refusal instead
        of showing a bare error, which is what the spec asks for.

        Phase 5's ``preferred_teacher`` reuses that 409 rather than adding an outcome:
        a waitlisted request is still "valid request, wrong state", and the entry it
        created is reported inside the same ``considered`` payload. So a client that
        already renders the refusal keeps working, and one that wants to say "you are
        on Ustadh's list" reads one extra key.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RouteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routed'
          description: 'Assigned. ``routed_reason`` says how: cohort_assigned, lead_available,
            lead_full_routed, or student_choice when a ``preferred_teacher`` was named
            and could take it. A cohort seat''s start time is the cohort''s own, which
            may differ from the requested one.'
        '400':
          description: 'The request itself is wrong: an unknown level, a parent not
            naming a linked child, a slot the assigned teacher lost to a concurrent
            booking, or a ``preferred_teacher`` who cannot teach this at all (unapproved,
            wrong track) — a refusal no amount of waiting fixes, so no waitlist entry
            is created for it.'
        '403':
          description: Not an active member of this organization.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoCapacity'
          description: 'No capacity. Carries why each step declined; nobody is booked
            outside their hours or over their cap to avoid this. For a ``preferred_teacher``
            request this is also the waitlisted outcome: ``considered.waitlist`` carries
            the entry, and no other teacher has been assigned.'
  /api/scheduling/organizations/{organization_pk}/waitlist/{id}/promote/:
    post:
      operationId: scheduling_organizations_waitlist_promote_create
      description: |-
        POST /api/scheduling/organizations/{id}/waitlist/{id}/promote/ — the lead grants the request.

        The whole fulfillment mechanism this phase ships. Automatic offering when a
        slot frees up is explicitly out of scope (spec, tech-debt.md): it needs
        background jobs and notification delivery, which is a phase of its own.

        Lead-only, for the same reason opening a cohort is: it commits a teacher's
        time. The booking goes through ``routing.promote_waitlist_entry``, so it takes
        the teacher's lock and re-validates every rule — an entry made last week
        against a teacher who has since filled up is refused with a 400 rather than
        forced through, which is acceptance criterion 8.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: Booked. The entry keeps its original request and now carries
            ``fulfilled_booking``; it is not deleted.
        '400':
          description: The teacher is no longer eligible for that slot — full, outside
            their hours, or already booked. The entry stays open.
        '403':
          description: Not an active member of this organization.
        '409':
          description: Already fulfilled.
  /api/scheduling/organizations/{organization_pk}/waitlist/for-teacher/:
    get:
      operationId: scheduling_organizations_waitlist_for_teacher_list
      description: |-
        GET /api/scheduling/organizations/{id}/waitlist/for-teacher/?teacher_id= — the queue to work.

        Open entries only, priority desc then longest-waiting, which comes from
        ``TeacherWaitlist.Meta.ordering`` rather than being re-stated here — the
        endpoint and any future automatic offer must agree about who is next.

        Lead-only. A sub-teacher reading who is waiting for *them* is a reasonable
        thing to want and a different decision (it exposes other families' requests
        to a teacher who cannot act on them), so it is deliberately not folded in
        here — see tech-debt.md.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: teacher_id
        schema:
          type: integer
        description: Whose waitlist to list.
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
          description: ''
  /api/scheduling/organizations/{organization_pk}/waitlist/mine/:
    get:
      operationId: scheduling_organizations_waitlist_mine_list
      description: |-
        GET /api/scheduling/organizations/{id}/waitlist/mine/ — the family's own entries and status.

        Open and fulfilled both, newest-priority-first per ``Meta.ordering``. A
        fulfilled entry stays visible because it is the record of a request that was
        honoured — "you asked for Ustadh in March and got the 4th of April" is the
        history the phase exists to keep.

        A **parent** reads their linked children's entries here as well as a student
        reading their own (product owner's call, 2026-08-25). ``/route/`` is
        ``IsStudentOrParent``, so a parent is one of the two people who can *create*
        an entry — and a requester who cannot then read their own request back is a
        hole, not a privacy boundary. Scoped through ``ParentLink`` exactly as
        ``BookingCancelView`` scopes cancellation, and for the same reason: a parent
        acts for their own children and nobody else's.

        Deliberately *not* matched by ``/api/pricing/agreements/mine/``, which stays
        student-only. A waitlist entry is scheduling; a negotiated rate is money, and
        who in a family may read one is a separate decision (tech-debt.md).
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
          description: ''
