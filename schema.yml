      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
          description: ''
        '400':
          description: Missing teacher_id, unknown teacher, or a bad period.
        '403':
          description: Not an organization owner or administrator.
  /api/payouts/organizations/{organization_pk}/statements/mine/:
    get:
      operationId: payouts_organizations_statements_mine_retrieve
      description: |-
        GET /api/payouts/organizations/<organization_pk>/statements/mine/?start=&end= — the teacher's own statement.

        A statement is computed from the payout records it lists, so the total is
