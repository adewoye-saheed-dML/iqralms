  /api/pricing/organizations/{organization_pk}/agreements/:
    get:
      operationId: pricing_organizations_agreements_list
      description: |-
        /api/pricing/organizations/<organization_pk>/agreements/ — the lead records rates, and reads them back.

        Both halves of the spec's surface on one path, because they are one resource:

        * **POST** records a pricing exception. Lead-only, with no sub-teacher path at
          all: this is the one lever that moves the lead's own margin (mvp-spec
          section 3). Creating an agreement for a student and level that already has a
          live one supersedes the old row rather than editing or deleting it, so the
          history survives.
        * **GET ?student_id=** lists one student's history in this academy — active
          *and* superseded, newest first.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        description: The academy this agreement belongs to.
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        description: Whose pricing history to list.
        required: true
      tags:
      - pricing
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PricingAgreement'
          description: ''
        '400':
          description: student_id missing or not an integer.
        '403':
          description: Not an active member or not the lead teacher.
    post:
      operationId: pricing_organizations_agreements_create
      description: |-
        /api/pricing/organizations/<organization_pk>/agreements/ — the lead records rates, and reads them back.

        Both halves of the spec's surface on one path, because they are one resource:

        * **POST** records a pricing exception. Lead-only, with no sub-teacher path at
          all: this is the one lever that moves the lead's own margin (mvp-spec
          section 3). Creating an agreement for a student and level that already has a
          live one supersedes the old row rather than editing or deleting it, so the
          history survives.
        * **GET ?student_id=** lists one student's history in this academy — active
          *and* superseded, newest first.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        description: The academy this agreement belongs to.
        required: true
      tags:
      - pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingAgreementCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricingAgreementCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricingAgreementCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingAgreement'
          description: Created and active. Any previous agreement for this student
            and level is now active=False, still queryable.
        '400':
          description: Not a student, an unknown level, or a negative rate.
        '403':
          description: Not an active member or not the lead teacher.
  /api/pricing/organizations/{organization_pk}/agreements/mine/:
    get:
      operationId: pricing_organizations_agreements_mine_list
      description: |-
        GET /api/pricing/organizations/<organization_pk>/agreements/mine/ — the student's own live rates.

        One row per level at most, because only active agreements are listed: a family
