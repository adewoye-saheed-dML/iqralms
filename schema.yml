openapi: 3.0.3
info:
  title: Quran Academy API
  version: 0.6.0
  description: 'Identity layer: users, roles, parent links, teacher profiles. Curriculum:
    tracks, levels, placement review. Scheduling: teacher availability, direct booking,
    Jitsi video. Routing: cohorts, capacity-based auto-assignment. Pricing: negotiated
    rates per student and level, lead-approved. Waitlist: preferred-teacher requests
    when that teacher is full. Assessment: per-session rubric scoring, lead review,
    family progress. Payouts: teacher payout records and period statements, lead-generated.
    Organizations: the multi-tenant foundation — academies and the memberships that
    grant access to one.'
paths:
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: GET /api/accounts/me/ — the logged-in user's own profile.
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/my-children/:
    get:
      operationId: accounts_my_children_list
      description: GET /api/accounts/my-children/ — students linked to the calling
        parent.
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedStudent'
          description: ''
  /api/accounts/organizations/{organization_pk}/children/:
    get:
      operationId: accounts_organizations_children_list
      description: |-
        GET /api/accounts/organizations/{id}/children/ — the caller's children *here*.

        The endpoint SaaS Phase 2 exists for. ``/my-children/`` answers "who are this
        parent's children", globally and correctly; this one answers "which of them is a
        student of *this* academy", and the difference between the two answers is the
        tenant boundary.

        Both sides must be active members: a parent whose own membership is suspended
        gets an empty list, and a linked child the academy has not admitted (or has
        suspended) is absent from it. So a real, global parent-child relationship cannot
        be used to make Academy A show a student who belongs to Academy B —
        ``tenancy.children_in_organization()`` is the one place that rule lives.

        A non-member is refused by ``IsOrganizationMember`` before the queryset runs,
        and a caller who is not a parent account gets the same 403
        ``/my-children/`` gives them. The fields are the same global ones too: no
        signup code, and nothing the academy owns.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedStudent'
          description: The caller's linked children who are active members of this
            organization. Empty when none are.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization, or not a parent
            account.
  /api/accounts/organizations/{organization_pk}/teacher-configurations/:
    get:
      operationId: accounts_organizations_teacher_configurations_list
      description: |-
        /api/accounts/organizations/{id}/teacher-configurations/ — owner/admin only.

        GET lists this academy's teaching terms; POST gives an existing member theirs.
        Staff and teacher members are refused both, the same narrower default the
        membership directory takes — what an academy pays its teachers is not something
        an ordinary member reads, and a narrow rule can be widened safely later.

        POST names a ``user``, and the membership is resolved inside this academy, so
        the request cannot reach a membership it does not administer. Only a ``lead`` or
        ``sub`` account may be given teaching terms: an organization role is authority,
        not a teaching identity, and Phase 2 preserves the account domain's rule about
        who can teach.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
    post:
      operationId: accounts_organizations_teacher_configurations_create
      description: |-
        /api/accounts/organizations/{id}/teacher-configurations/ — owner/admin only.

        GET lists this academy's teaching terms; POST gives an existing member theirs.
        Staff and teacher members are refused both, the same narrower default the
        membership directory takes — what an academy pays its teachers is not something
        an ordinary member reads, and a narrow rule can be widened safely later.

        POST names a ``user``, and the membership is resolved inside this academy, so
        the request cannot reach a membership it does not administer. Only a ``lead`` or
        ``sub`` account may be given teaching terms: an organization role is authority,
        not a teaching identity, and Phase 2 preserves the account domain's rule about
        who can teach.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '400':
          description: Not a member of this organization, already configured here,
            or an account that cannot teach.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
  /api/accounts/organizations/{organization_pk}/teacher-configurations/{id}/:
    get:
      operationId: accounts_organizations_teacher_configurations_retrieve
      description: |-
        GET/PATCH one set of teaching terms — approve, re-cap the week, re-rate the hour.

        The endpoint that proves the phase: PATCHing a teacher's terms here changes what
        *this* academy asks of them and nothing about any other academy they work for,
        because the row being written belongs to one membership. A configuration id from
        another tenant is a 404 from the scoped queryset.

        PUT is not offered. A whole-object replace would have to accept ``membership``,
        which is not editable — terms pointing at a different person or academy are
        different terms.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
        '404':
          description: No such teaching terms in this organization.
    patch:
      operationId: accounts_organizations_teacher_configurations_partial_update
      description: |-
        GET/PATCH one set of teaching terms — approve, re-cap the week, re-rate the hour.

        The endpoint that proves the phase: PATCHing a teacher's terms here changes what
        *this* academy asks of them and nothing about any other academy they work for,
        because the row being written belongs to one membership. A configuration id from
        another tenant is a 404 from the scoped queryset.

        PUT is not offered. A whole-object replace would have to accept ``membership``,
        which is not editable — terms pointing at a different person or academy are
        different terms.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '400':
          description: Nothing to change, or a value out of range.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
        '404':
          description: No such teaching terms in this organization.
  /api/accounts/parent-links/:
    post:
      operationId: accounts_parent_links_create
      description: POST /api/accounts/parent-links/ — parent links to a student by
        code.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentLinkCreate'
          description: ''
  /api/assessment/organizations/{organization_pk}/{id}/:
    get:
      operationId: assessment_organizations_retrieve
      description: |-
        GET /api/assessment/organizations/<organization_pk>/{id}/ — the lead opens one assessment in full.

        The drill-down from the review queue: booking, student, teacher, rubric
        snapshot, scores, flag reason and any review note. Lead-only, and reading it
        does **not** mark it reviewed — the spec is explicit that clearing a flag is an
        explicit action, so the review stamp only ever comes from the POST below.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/{id}/review/:
    post:
      operationId: assessment_organizations_review_create
      description: |-
        POST /api/assessment/organizations/<organization_pk>/{id}/review/ — the lead annotates and marks reviewed.

        Writes three fields and no others. The teacher's scores, summary and flag are
        untouched, and the model refuses to change them on an existing row, so "review
        never rewrites historical teacher data" holds even for a caller that tries.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadReview'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAssessment'
          description: Reviewed. The assessment has left the pending queue.
        '403':
          description: Not the lead teacher.
        '404':
          description: No such assessment.
  /api/assessment/organizations/{organization_pk}/bookings/{booking_id}/:
    post:
      operationId: assessment_organizations_bookings_create
      description: |-
        POST /api/assessment/organizations/<organization_pk>/bookings/{booking_id}/ — the teacher who taught it scores it.

        Two layers keep this to the right teacher and the right booking. The queryset
        is scoped to ``teacher=request.user``, so another teacher's session is a **404**
        rather than a 403 — a 403 would confirm the booking exists. And
        ``SessionAssessment.clean()`` re-checks ``assessed_by == booking.teacher``
        anyway, so a future caller that skips this view cannot get it wrong either.

        A booking that is scheduled, cancelled or a no-show is a **400** carrying the
        model's own message: it exists and belongs to this teacher, it is simply not a
        session that happened. Submitting an assessment does not mark a booking
        completed — that stays a separate act.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssessment'
          description: Submitted, with the rubric and criterion names snapshotted.
        '400':
          description: The booking is not completed, the track has no active rubric,
            a criterion is missing/unknown/duplicated, a score is outside 1-5, or
            this booking is already assessed.
        '403':
          description: Not a teacher account.
        '404':
          description: No such session for this teacher.
  /api/assessment/organizations/{organization_pk}/child/:
    get:
      operationId: assessment_organizations_child_list
      description: |-
        GET /api/assessment/organizations/<organization_pk>/child/?student_id= — a linked child's assessment history.

        Same family shape as ``/mine/``, reached through the ``ParentLink`` check.
        Not in the spec's endpoint list, but the spec's visibility table gives a parent
        "linked-child assessments/progress" and progress alone would not be that.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyAssessment'
          description: ''
        '403':
          description: Not a parent, or not this parent's child.
  /api/assessment/organizations/{organization_pk}/mine/:
    get:
      operationId: assessment_organizations_mine_list
      description: |-
        GET /api/assessment/organizations/<organization_pk>/mine/ — the student's own assessment history.

        Family shape: the teacher's summary, the criterion scores and comments, and no
        internal quality-control field at all. Scoped to ``student=request.user``, so
        this endpoint cannot be pointed at anybody else.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/progress/child/:
    get:
      operationId: assessment_organizations_progress_child_retrieve
      description: |-
        GET /api/assessment/organizations/<organization_pk>/progress/child/?student_id=&track_id= — a linked child's.

        The ``ParentLink`` check is the whole endpoint: an unrelated parent asking about
        somebody else's child is refused, and the refusal happens before any progress is
        computed, not by omitting fields from a response that was built anyway.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        description: Which of your children.
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
          description: ''
        '400':
          description: A missing or unknown parameter.
        '403':
          description: Not a parent, or not a parent of that student.
  /api/assessment/organizations/{organization_pk}/progress/mine/:
    get:
      operationId: assessment_organizations_progress_mine_retrieve
      description: GET /api/assessment/organizations/<organization_pk>/progress/mine/?track_id=
        — the student's own progress.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        description: Which track's progress. Progress is per track.
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
          description: ''
        '400':
          description: track_id missing or unknown.
        '403':
          description: Not a student account.
  /api/assessment/organizations/{organization_pk}/reports/teachers/:
    get:
      operationId: assessment_organizations_reports_teachers_retrieve
      description: |-
        GET /api/assessment/organizations/<organization_pk>/reports/teachers/ — lead-only quality visibility.

        Optionally narrowed by ``from``/``to`` and ``track_id``. Per teacher: how many
        sessions they assessed, the overall average, the average per track, how many
        they flagged, and how many of those flags are still waiting on the lead.

        Two things it is not. It is **not** a leaderboard: rows come back ordered by
        username and carry no rank. And it does **not** invent rows — a teacher who
        assessed nothing in the window is absent rather than present with 0.00, because
        a missing assessment is missing data and a zero next to someone's name is an
        accusation.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherReport'
          description: ''
        '400':
          description: An unparseable period or track_id.
        '403':
          description: Not the lead teacher — a sub-teacher has no academy-wide view.
  /api/assessment/organizations/{organization_pk}/review/queue/:
    get:
      operationId: assessment_organizations_review_queue_list
      description: |-
        GET /api/assessment/organizations/<organization_pk>/review/queue/ — flagged and not yet reviewed.

        One definition of the queue, ``SessionAssessment.pending_lead_review()``, so
        the count in the teacher report and the list here cannot disagree. A reviewed
        assessment leaves it; the flag itself stays on the record, because that the
        teacher raised one is history.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/rubrics/:
    get:
      operationId: assessment_organizations_rubrics_list
      description: |-
        /api/assessment/organizations/<organization_pk>/rubrics/ — the lead configures what teachers score against.

        * **GET ?track_id=** lists rubrics, newest first, superseded ones included:
          "what do we score Tajweed on, and what did we score it on before" is one
          question. Without ``track_id`` it lists every track's.
        * **POST** creates a rubric with its criteria. If the track already has an
          active rubric, that one is superseded rather than edited — see
          ``AssessmentRubricCreateSerializer``.

        Lead-only on both sides. A rubric decides what every teacher in the academy is
        measured on, so it is not something a sub-teacher configures for themselves.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track's rubrics.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentRubric'
          description: ''
        '403':
          description: Not the lead teacher.
    post:
      operationId: assessment_organizations_rubrics_create
      description: |-
        /api/assessment/organizations/<organization_pk>/rubrics/ — the lead configures what teachers score against.

        * **GET ?track_id=** lists rubrics, newest first, superseded ones included:
          "what do we score Tajweed on, and what did we score it on before" is one
          question. Without ``track_id`` it lists every track's.
        * **POST** creates a rubric with its criteria. If the track already has an
          active rubric, that one is superseded rather than edited — see
          ``AssessmentRubricCreateSerializer``.

        Lead-only on both sides. A rubric decides what every teacher in the academy is
        measured on, so it is not something a sub-teacher configures for themselves.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRubricCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentRubricCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentRubricCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentRubric'
          description: Created and active. Any previous rubric for this track is now
            active=False, still queryable, and its criteria still back the assessments
            submitted against them.
        '400':
          description: Unknown track, no criteria, or a repeated order.
        '403':
          description: Not the lead teacher.
  /api/assessment/organizations/{organization_pk}/rubrics/{id}/:
    get:
      operationId: assessment_organizations_rubrics_retrieve
      description: |-
        /api/assessment/organizations/<organization_pk>/rubrics/{id}/ — read one rubric, or edit it in place.

        PATCH is the operation the historical-data rule is about: renaming or retiring
        a criterion changes what *future* assessments look like and leaves every
        existing one exactly as it was, because each score carries the criterion name
        it was submitted under. Nothing here rewrites an ``AssessmentScore``, and the
        model would refuse if it tried.

        PUT is not offered. A whole-object replace on live configuration whose
        criteria are referenced by historical records is not a coherent operation;
        replacing a rubric wholesale is a POST to the collection, which supersedes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentRubric'
          description: ''
    patch:
      operationId: assessment_organizations_rubrics_partial_update
      description: |-
        /api/assessment/organizations/<organization_pk>/rubrics/{id}/ — read one rubric, or edit it in place.

        PATCH is the operation the historical-data rule is about: renaming or retiring
        a criterion changes what *future* assessments look like and leaves every
        existing one exactly as it was, because each score carries the criterion name
        it was submitted under. Nothing here rewrites an ``AssessmentScore``, and the
        model would refuse if it tried.

        PUT is not offered. A whole-object replace on live configuration whose
        criteria are referenced by historical records is not a coherent operation;
        replacing a rubric wholesale is a POST to the collection, which supersedes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentRubricUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentRubricUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssessmentRubricUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentRubric'
          description: ''
        '400':
          description: A repeated order, or a criterion id from another rubric.
        '403':
          description: Not the lead teacher.
  /api/assessment/organizations/{organization_pk}/snapshots/:
    post:
      operationId: assessment_organizations_snapshots_create
      description: |-
        POST /api/assessment/organizations/<organization_pk>/snapshots/ — the lead freezes a period.

        An explicit lead action, deliberately: automatic snapshot jobs are out of scope
        for this phase. Repeating a request for the same student, track and period
        returns the **existing** row with a **200** and changes nothing, which is the
        spec's duplicate rule — a snapshot that moved when you asked for it twice would
        not be a snapshot.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressSnapshotCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProgressSnapshotCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProgressSnapshotCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
          description: Generated.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
          description: This period was already snapshotted. The existing row is returned
            untouched — no duplicate, and no recomputation.
        '400':
          description: Not a student, an inverted period, or an unknown track.
        '403':
          description: Not the lead teacher.
