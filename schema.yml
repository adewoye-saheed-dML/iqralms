  /api/organizations/{id}/:
    get:
      operationId: organizations_retrieve
      description: |-
        GET /api/organizations/{id}/ — one academy, for its members only.

        Knowing the id is not access. A non-member and a suspended member both get
        403, and the object is fetched through the caller's own membership rather than
        from ``Organization.objects``, so there is no queryset here that could return a
        tenant the caller does not belong to.

        Every active role may read the academy — owner, admin, staff and teacher. It is
        the organization's own name, slug and timezone; the things worth protecting
        inside a tenant are its members and, in later phases, its students, schedules
        and money.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - organizations
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization.
  /api/organizations/mine/:
    get:
      operationId: organizations_mine_list
      description: |-
        GET /api/organizations/mine/ — the academies the caller belongs to.

        One entry per active membership, each carrying the organization, the caller's
        role in it and the membership's status — enough for a client to know where the
        user can act and as what. A user in two academies sees two entries.

        Suspended memberships are absent, which is the same rule every other endpoint
        here applies: an active membership is what grants tenant access, and a
        suspended member reading the academy's name and timezone through this listing
        would be the one hole in it. Telling a suspended member *why* they lost access
        is a product decision for the onboarding phase (see learnings.md).
      tags:
      - organizations
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyOrganizationMembership'
          description: ''
        '401':
          description: Not authenticated.
  /api/payouts/organizations/{organization_pk}/{id}/finalize/:
    post:
      operationId: payouts_organizations_finalize_create
      description: |-
        POST /api/payouts/organizations/<organization_pk>/<int:pk>/finalize/ — make one payout history.

        Owner/admin-only, and one-way: after this the record refuses every write, including
        the lead's own. A payout that is already finalized answers 409 rather than
        silently succeeding, because a second finalization means the caller is acting
        on a stale copy of a financial record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - payouts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPayout'
          description: Finalized. The record is now immutable.
        '403':
          description: Not an organization owner or administrator.
        '404':
          description: No such payout.
        '409':
          description: Already finalized.
  /api/payouts/organizations/{organization_pk}/generate/:
    post:
      operationId: payouts_organizations_generate_create
      description: |-
        POST /api/payouts/organizations/<organization_pk>/generate/ — turn a period's completed sessions into payouts.

        Safe to repeat, which is the property that makes it usable: a lead who is not
        sure whether the run went through can simply run it again, and the second run
        creates nothing. Existing records are never recalculated, so a rate raised
        yesterday does not reprice last month's payroll.

        The response reports both halves of the run. ``skipped`` is not noise: a
        sub-teacher's session skipped for ``no_payout_rate`` is the lead's cue to set
        a rate, and a group-class seat skipped for ``cohort_session_already_paid``
        explains why a busy session produced one record.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - payouts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResult'
          description: Records created, plus every booking that was skipped and why.
            A repeat run answers 201 with created_count 0.
        '400':
          description: Bad period, or an unknown teacher.
        '403':
          description: Not an organization owner or administrator.
  /api/payouts/organizations/{organization_pk}/lead/:
    get:
      operationId: payouts_organizations_lead_list
      description: |-
        GET /api/payouts/organizations/<organization_pk>/lead/ — academy-wide payout records.

        Filterable by ``?teacher_id=`` and by period. Unfiltered it is every payout
        record in the academy, which is the owner/admin's to see and nobody else's:
        the permission class is the only thing standing between this queryset and a
        sub-teacher reading their colleagues' income, which is why it is the *first*
        thing the class declares.
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: Exclusive period end, ISO-8601 UTC.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
        description: Inclusive period start, ISO-8601 UTC, e.g. 2026-08-01T00:00:00Z.
      - in: query
        name: teacher_id
        schema:
          type: integer
        description: Narrow the listing to one teacher.
      tags:
      - payouts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherPayout'
          description: ''
        '400':
          description: Unknown teacher, or a bad period.
        '403':
          description: Not an organization owner or administrator.
  /api/payouts/organizations/{organization_pk}/mine/:
    get:
      operationId: payouts_organizations_mine_list
      description: |-
        GET /api/payouts/organizations/<organization_pk>/mine/ — the caller's own payout records.

        Optionally bounded by ``?start=&end=``; unbounded it is the teacher's whole
        payout history in this academy, which is theirs to read. The queryset is scoped
        to ``request.user`` and ``self.organization``, and there is no parameter that
        could widen it — another teacher's records are not a 403 here, they simply are
        not in the set.

        Generated and finalized records both appear. A teacher seeing only finalized
        ones would have no way to check a draft before it becomes history.
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: Exclusive period end, ISO-8601 UTC.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
        description: Inclusive period start, ISO-8601 UTC, e.g. 2026-08-01T00:00:00Z.
      tags:
      - payouts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTeacherPayout'
          description: ''
        '400':
          description: Unparseable or inverted period.
        '403':
          description: Not an active teacher account in this academy.
