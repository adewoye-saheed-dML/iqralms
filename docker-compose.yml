# Local development infrastructure for a fresh clone (Phase 6).
#
#   docker compose up -d
#
# gives you the two services the application needs and nothing else: PostgreSQL,
# which is now the canonical database with no SQLite fallback, and MinIO, which
# is an S3-compatible bucket so the *private* storage path is the one you develop
# against rather than a local-disk stand-in.
#
# You do not have to use this. Any PostgreSQL will do — point DATABASE_URL at it.
# On a machine that already runs PostgreSQL natively, `createdb quran` and
# `DATABASE_URL=postgres:///quran` is the whole setup. What you must not do is
# reintroduce a SQLite fallback for convenience (CLAUDE.md).
#
# The credentials here are deliberately trivial and deliberately committed: they
# reach nothing but a container on your own machine. Never reuse this file's
# values, or this shape of file, for a deployment.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quran
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
    ports:
      # Published so manage.py can reach it from the host. Change the host side
      # if you already run PostgreSQL on 5432.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `docker compose up -d --wait` then blocks until migrations can actually
      # run, rather than until the container has merely started.
      test: ["CMD-SHELL", "pg_isready -U quran -d quran"]
      interval: 3s
      timeout: 3s
      retries: 20

  # An S3-compatible bucket, so development exercises the same code path
  # production does: private objects reached by presigned URL. The alternative —
  # DJANGO_STORAGE_BACKEND=private-local — keeps files on local disk and signs
  # access with SECRET_KEY, which works and is what the test suite uses, but it
  # is a stand-in rather than the real thing.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quranminio
      MINIO_ROOT_PASSWORD: quranminio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket once and exits. Left as a one-shot job rather than a
  # documented manual step, because a missing bucket fails at the first upload
  # with an S3 error that says nothing about what to do.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 quranminio quranminio &&
      mc mb --ignore-existing local/quran-placement-audio &&
      mc anonymous set none local/quran-placement-audio &&
      echo 'bucket ready and private'
      "

volumes:
  postgres-data:
  minio-data:
